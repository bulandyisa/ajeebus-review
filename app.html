<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajeebus — app prototype v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ================= ТОКЕНЫ =================
     Тёмная тема по умолчанию: мир сериала — тёплый полумрак, чай, лампа.
     Светлая — тот же макет на слоновой кости. Цвета только переменными. */
  :root{
    --bg:#0E0B08; --bg2:#151009; --card:#1C1610; --card2:#241D15;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --ink:#F5EEE2; --dim:#B6A894; --faint:#7E7263;
    --gold:#D9A441; --gold-ink:#20180C; --gold-soft:rgba(217,164,65,.14);
    --em:#3BB795; --em-deep:#1B6E5B; --em-soft:rgba(59,183,149,.14);
    --clay:#E0603C; --clay-soft:rgba(224,96,60,.15);
    --scrim:linear-gradient(to top,rgba(10,8,6,.97) 10%,rgba(10,8,6,.86) 44%,rgba(10,8,6,.34) 100%);
    --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
    --r:20px;
  }
  :root[data-theme="light"]{
    --bg:#FAF5EC; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F6EFE2;
    --line:rgba(26,21,15,.10); --line2:rgba(26,21,15,.18);
    --ink:#1A150F; --dim:#6C6153; --faint:#9C9080;
    --gold:#A8760F; --gold-ink:#FFFFFF; --gold-soft:rgba(168,118,15,.12);
    --em:#12796A; --em-deep:#0C5A4E; --em-soft:rgba(18,121,106,.12);
    --clay:#B4432A; --clay-soft:rgba(180,67,42,.12);
    --scrim:linear-gradient(to top,rgba(20,15,10,.92) 4%,rgba(20,15,10,.55) 42%,rgba(20,15,10,0) 82%);
    --shadow:0 1px 3px rgba(60,45,20,.07),0 14px 34px rgba(60,45,20,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font:16px/1.5 'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:#080705;color:var(--ink);height:100dvh;overflow:hidden}
  :root[data-theme="light"] body{background:#EDE5D6}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}
  img{display:block;max-width:100%}
  .ar{font-family:'Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;line-height:1.75}
  .dsp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;letter-spacing:-.01em}
  .kick{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .muted{color:var(--dim)}

  .app{max-width:430px;margin:0 auto;height:100dvh;background:var(--bg);position:relative;
       display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .ribbon{background:#000;color:var(--dim);font-size:9.5px;padding:4px 12px;text-align:center;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;flex:none}
  .ribbon b{color:var(--gold)}
  #view{flex:1;display:flex;flex-direction:column;min-height:0}
  .scr{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .pad{padding:0 20px 30px}

  /* ---------- нижняя навигация ---------- */
  .nav{flex:none;display:flex;gap:4px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
       background:var(--bg2);border-top:1px solid var(--line)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;
              font-size:10px;font-weight:600;color:var(--faint);border-radius:14px;letter-spacing:.02em}
  .nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
  .nav button[aria-pressed="true"]{color:var(--gold)}

  /* ---------- шапки ---------- */
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
  .wordmark{font-size:23px;font-weight:600;letter-spacing:-.02em}
  .pill{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);
        background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
           display:grid;place-items:center;font-size:15px;color:var(--dim);flex:none}
  .head2{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;
         padding:14px 18px 12px;background:var(--bg);border-bottom:1px solid transparent}
  .scr.scrolled .head2{border-bottom-color:var(--line);backdrop-filter:blur(8px)}
  .back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
        color:var(--ink);border:1px solid var(--line);flex:none}
  .head2 .h2t{font-size:18px;font-weight:600}
  .head2 .h2s{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}

  /* ---------- герой курса ---------- */
  .hero{position:relative;margin:4px 20px 0;border-radius:24px;overflow:hidden;border:1px solid var(--line);
        box-shadow:var(--shadow);background:var(--card)}
  .hero img{width:100%;height:250px;object-fit:cover;object-position:center 35%;filter:brightness(.82)}
  .hero .veil{position:absolute;inset:0;background:var(--scrim)}
  .hero .txt{position:absolute;left:18px;right:18px;bottom:16px;color:#F7F1E6}
  .hero h2{font-size:29px;font-weight:600;margin:4px 0 8px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .hero .sub{font-size:12.5px;color:#D9CDBA;margin-bottom:12px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
  .barrow{display:flex;align-items:center;gap:10px}
  .barrow .n{font-size:11px;font-weight:700;color:#EADFCB;white-space:nowrap}

  .cta{width:100%;background:var(--em);color:#06231C;font-size:15.5px;font-weight:700;letter-spacing:.01em;
       padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
       position:relative;overflow:hidden;transition:transform .1s}
  :root[data-theme="light"] .cta{color:#fff}
  .cta:active{transform:scale(.985)}
  .cta:disabled{background:var(--card2);color:var(--faint)}
  .cta.auto::after{content:'';position:absolute;left:0;bottom:0;height:3px;background:rgba(0,0,0,.35);
                   width:100%;animation:cd 2s linear forwards}
  @keyframes cd{to{width:0}}
  .cta.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
  .ctawrap{padding:14px 20px 4px}

  /* ---------- строки курсов ---------- */
  .sect{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
        margin:26px 2px 12px}
  .crow{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:var(--card);
        border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:9px;transition:.12s}
  .crow:active{transform:scale(.99)}
  .crow img{width:58px;height:58px;border-radius:13px;object-fit:cover;flex:none}
  .crow .ph{width:58px;height:58px;border-radius:13px;flex:none;display:grid;place-items:center;
            background:var(--card2);font-size:22px;font-weight:700;color:var(--faint)}
  .crow .t{font-size:15px;font-weight:600}
  .crow .code{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;margin-left:7px}
  .crow .s{font-size:11.5px;color:var(--dim);margin-top:3px}
  .crow .mark{margin-left:auto;color:var(--faint);font-size:15px;flex:none}
  .crow.done{border-color:rgba(59,183,149,.35)}
  .crow.done .mark{color:var(--em)}
  .crow.locked img{filter:grayscale(.7) brightness(.55)}
  .crow.locked .t{color:var(--dim)}

  /* ---------- баннер серии ---------- */
  .epbanner{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
            border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:2px}
  .epbanner img{width:64px;height:48px;border-radius:11px;object-fit:cover;flex:none}
  .epbanner .t{font-size:13px;font-weight:600}
  .epbanner .s{font-size:11px;color:var(--dim);margin-top:2px}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.1em;
        color:var(--gold);text-transform:uppercase}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- стрик ---------- */
  .anza{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
        border-radius:18px;padding:12px 14px;margin-top:10px}
  .anza .em{font-size:24px}
  .anza .t{font-size:13px;font-weight:600}
  .anza .s{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.45}

  /* ================= САЛЯМ ================= */
  .salamwrap{position:relative;flex:1;display:flex;min-height:0}
  .salamwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .salamwrap .veil{position:absolute;inset:0;
    background:linear-gradient(to top,rgba(8,6,4,.97) 20%,rgba(8,6,4,.7) 55%,rgba(8,6,4,.45) 100%)}
  .stxt{position:relative;margin-top:auto;padding:0 24px calc(30px + env(safe-area-inset-bottom));width:100%;color:#F7F1E6}
  .stxt .big{font-size:44px;margin:8px 0 10px}
  .stxt p{font-size:14px;color:#CDBFA9;line-height:1.6;margin-bottom:22px;max-width:300px}
  .hint{text-align:center;font-size:10.5px;color:#8B8071;margin-top:10px}

  /* ================= ОБЩЕЕ ================= */
  .foot{text-align:center;font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:22px}
  .lead{font-size:13.5px;color:var(--dim);line-height:1.65;margin-bottom:16px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
        font-size:12.5px;line-height:1.55;color:var(--dim);margin-bottom:12px}
  .note.gold{background:var(--gold-soft);border-color:rgba(217,164,65,.3);color:var(--ink)}
  .note b{color:var(--ink)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chips span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
  .cover{position:relative;border-radius:20px;overflow:hidden;margin:2px 0 14px;border:1px solid var(--line)}
  .cover img{width:100%;height:170px;object-fit:cover;object-position:center 40%;filter:brightness(.72)}
  .cover .veil{position:absolute;inset:0;background:var(--scrim)}
  .covtxt{position:absolute;left:16px;right:16px;bottom:14px;font-size:13.5px;line-height:1.55;color:#F0E7D8}
  .prow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:12px 14px;margin-bottom:9px}
  .prow .pnum{width:28px;height:28px;border-radius:9px;background:var(--card2);color:var(--dim);flex:none;
              display:grid;place-items:center;font-size:12.5px;font-weight:700}
  .prow.dn .pnum{background:var(--em-soft);color:var(--em)}
  .prow .pt{font-size:13.5px;font-weight:600}
  .prow .pr{font-size:10px;color:var(--faint);font-weight:600;margin-left:7px}
  .prow .pdsc{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
  .reset{display:block;margin:20px auto 0;font-size:10.5px;color:var(--faint);text-decoration:underline}

  /* ================= ПУТЬ ================= */
  .pathwrap{padding:0 20px 30px}
  .unlockbar{display:block;width:calc(100% - 40px);margin:2px 20px 6px;background:var(--gold-soft);
             border:1px dashed rgba(217,164,65,.45);color:var(--gold);font-size:11.5px;font-weight:600;
             border-radius:14px;padding:10px 12px;text-align:left}
  .chapter{position:relative;border-radius:20px;overflow:hidden;margin:18px 0 4px;border:1px solid var(--line)}
  .chapter img{width:100%;height:168px;object-fit:cover;object-position:center 45%;filter:brightness(.72) saturate(.95)}
  .chapter .veil{position:absolute;inset:0;background:var(--scrim)}
  .chtxt{position:absolute;left:16px;right:16px;bottom:14px;color:#F7F0E4;
       text-shadow:0 1px 12px rgba(0,0,0,.75)}
  .chtxt h3{font-size:23px;font-weight:600;margin:3px 0 6px}
  .chtxt p{font-size:11.5px;color:#D2C5B2;line-height:1.5;margin-bottom:10px}
  .nodes{position:relative;padding:14px 0 6px}
  .nodes::before{content:'';position:absolute;left:50%;top:0;bottom:14px;
                 border-left:2px dashed var(--line2);transform:translateX(-1px)}
  .noderow{position:relative;z-index:1;width:max-content;max-width:190px;margin:9px auto;
           display:flex;flex-direction:column;align-items:center}
  .node{width:64px;height:64px;border-radius:50%;background:var(--card);border:1.5px solid var(--line2);
        display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink);position:relative;
        box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .12s}
  .node:active{transform:scale(.94)}
  .node .lockdot{position:absolute;top:-2px;right:-4px;font-size:13px}
  .node.is-done{background:var(--em);border-color:var(--em);color:#06231C;font-size:25px}
  :root[data-theme="light"] .node.is-done{color:#fff}
  .node.is-cur{width:82px;height:82px;font-size:24px;color:var(--gold);border:2px solid var(--gold);
               background:var(--card2);box-shadow:0 0 0 6px var(--gold-soft),0 10px 28px rgba(0,0,0,.4)}
  .node.is-lock{opacity:.62}
  .node.is-soon{opacity:.3;box-shadow:none}
  .startchip{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);
             color:var(--gold-ink);border-radius:99px;padding:3px 11px;margin-bottom:8px}
  .nlabel{margin-top:9px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.35;max-width:170px}
  .node.is-cur+.nlabel{color:var(--gold);font-weight:600}

  /* ================= СЕРИАЛ ================= */
  .eprow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
         border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px}
  .eprow.soon{opacity:.5}
  .eprow .thumb{position:relative;width:76px;height:56px;border-radius:11px;overflow:hidden;flex:none}
  .eprow .thumb img{width:100%;height:100%;object-fit:cover}
  .eprow .play{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#fff;
               background:rgba(0,0,0,.35)}
  .eprow .t{font-size:13px;font-weight:600}
  .eprow .s{font-size:11px;color:var(--dim);margin-top:2px}
  .eprow .mark{margin-left:auto;font-size:14px}

  /* ================= ПРОФИЛЬ ================= */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
  .stat b{display:block;font-size:24px;font-weight:600}
  .stat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}

  /* ================= ПЕЙВОЛЛ ================= */
  .pwscr{background:var(--bg)}
  .pwhero{position:relative}
  .pwhero img{width:100%;height:260px;object-fit:cover;object-position:center 40%}
  .pwhero .veil{position:absolute;inset:0;background:var(--scrim)}
  .pwx{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;
       background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:15px}
  .pwtxt{position:absolute;left:20px;right:20px;bottom:16px;color:#F7F1E6}
  .pwtxt h2{font-size:26px;font-weight:600;line-height:1.25;margin-top:6px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .bens{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .bens .b{display:flex;gap:10px;font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:9px}
  .bens .b:last-child{margin-bottom:0}
  .bens .b::before{content:'✓';color:var(--em);font-weight:800}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .plan{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:18px;
        padding:16px 10px 13px;text-align:center;display:flex;flex-direction:column;gap:3px}
  .plan b{font-size:16px;font-weight:600}
  .plan span{font-size:11.5px;color:var(--ink)}
  .plan em{font-size:10px;color:var(--faint);font-style:normal}
  .plan.sel{border-color:var(--gold);background:var(--gold-soft)}
  .plan .badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);
               color:var(--gold-ink);font-size:8.5px;font-weight:800;letter-spacing:.08em;
               border-radius:99px;padding:3px 9px;text-transform:uppercase}
  .pwnote{text-align:center;font-size:9.5px;color:var(--faint);margin-top:12px}
  .pwfoot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
          background:var(--bg2)}
  .later{width:100%;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:11px 0 2px}

  /* ================= УРОК ================= */
  .flow{flex:1;display:flex;flex-direction:column;min-height:0}
  .fhead{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;flex:none}
  .fx{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;
      font-size:16px;color:var(--dim);flex:none}
  .fbar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
  .fbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.3,1)}
  .fbody{flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;min-height:0}
  .ffoot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
         background:var(--bg2)}
  .fb{display:none;align-items:flex-start;gap:11px;padding:13px 20px;margin:0}
  .fb.good{display:flex;background:var(--em-soft);color:var(--em)}
  .fb.bad{display:flex;background:var(--clay-soft);color:var(--clay)}
  .fb .fi{font-size:19px;line-height:1.1}
  .fb .f1{font-weight:700;font-size:14px}
  .fb .f2{font-size:12.5px;margin-top:2px;color:var(--dim)}
  .fb .f2 .ar{font-size:16px;color:var(--ink)}
  .qkick{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  .q{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:14px}

  /* интро урока */
  .lintro{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
  .lintro .cardimg{width:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);position:relative}
  .lintro .cardimg img{width:100%;height:236px;object-fit:cover}
  /* кадр в интро урока — сериал должен быть видно, поэтому вуаль лёгкая */
  .lintro .cardimg .veil{position:absolute;inset:0;
     background:linear-gradient(to top,rgba(10,8,6,.55) 0%,rgba(10,8,6,.10) 45%,rgba(10,8,6,0) 100%)}
  .lintro h2{font-size:25px;font-weight:600}
  .lintro .goal{font-size:13.5px;color:var(--dim);line-height:1.6;max-width:310px}
  .lintro .meta{display:flex;gap:7px}
  .lintro .meta span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:5px 11px}

  /* слово */
  .wordwrap{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .wpic{width:190px;height:190px;border-radius:50%;overflow:hidden;position:relative;border:1px solid var(--line);
        display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 22%,var(--card2),var(--card));
        box-shadow:var(--shadow);margin-bottom:20px;font-size:76px}
  .wpic img{width:100%;height:100%;object-fit:cover;opacity:.9}
  .wpic .em{position:relative;z-index:1;text-shadow:0 8px 26px rgba(0,0,0,.55)}

let voices=[];
function loadVoices(){ voices=speechSynthesis.getVoices()||[]; }
loadVoices(); if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;
function speak(text,lang,rate){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=rate||0.82;
    const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.split('-')[0]));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
    return u;
  }catch(e){return null}
}

const AR_RE=/[؀-ۿ]/;
function gloss(ru){ if(!ru) return ''; if(AR_RE.test(ru)) return ru; return EN_GLOSS[ru]||ru; }

/* ---------- фраза-пример для карточки слова: ищем в материале урока фразу ≥2 слов с этим словом ---------- */
const stripAr=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[؟!.,،:؛]/g,'').replace(/\s+/g,' ').trim();
function phraseFor(v,P){
  const w=stripAr(v.ar); if(!w) return null;
  const cand=[];
  for(const d of P.drills||[]){
    if(d.type==='build') for(const it of d.items) cand.push(it.target);
    if(d.type==='say') for(const it of d.items) if(typeof it==='string') cand.push(it);
    if(d.type==='gap') for(const it of d.items) if(it.text&&it.answer) cand.push(it.text.replace('___',it.answer));
  }
  for(const v2 of P.vocab||[]) if(v2!==v) cand.push(v2.ar);
  for(const c of cand){
    const sc=stripAr(c);
    if(sc!==w && sc.split(' ').length>=2 && (' '+sc+' ').includes(' '+w+' ')) return c;
  }
  return null;
}

 t:['«كم» means “how many”. It goes in front of the thing, and the thing stays in the singular: «كم تفاحة؟» — “how many apples?”, literally “how many apple?”. One question word, the noun never changes — that makes life simpler.',
    'We learn 1–10 as labels, without rules. Arabic numbers do have a famous agreement system — we come back to it many lessons from now, when there is something to agree. For now the task is one: hear “khamsa” and understand “five”.',
    'Advice from life: numbers are not memorized in a column, they are memorized at a till. Count everything out loud — steps, dates, cups.'],
 voice:'Numbers, my friend, are not a maths lesson. They are the market! You say “kam?” — they answer. Did not catch it? You already know what to say: “marra thaniya” — again… ah, no-no, that is the next lesson. For now just count: wahid, ithnan, thalatha. Salma next door counts to ten faster than I do. She is six years old. That is the offensive part!',
 w:['كم تفاحة؟ — “how many apples?”: after كم the noun stays singular.',
    'Numbers 1–10 are labels for the ear, no grammar attached.',
    'واحد، اثنان، ثلاثة، أربعة، خمسة — the first five are compulsory, the rest you recognize.'],
 p:'Count five objects on your desk out loud in Arabic.'},

7:{goal:'Refuse, admit you did not understand, and ask for it slower.',
 tt:'La + verb — and the three most honest phrases',
 t:['Negation in the present is simply لا in front of the verb: أريد “I want” → لا أريد “I do not want”, أفهم “I understand” → لا أفهم “I do not understand”. No auxiliary words, no change to the verb itself.',
    '“I do not understand” is not a defeat, it is a tool. Say لا أفهم، مرة ثانية and the other person will repeat more slowly. In Arab culture asking again is not shameful; nodding without understanding is.',
    'And a relative of “ma haza” from lesson two: ما معنى؟ — “what does it mean?” There you asked about objects, here about words. With these two questions you no longer need a teacher… almost.'],
 voice:'Learn three phrases, my friend, and I am calm about you in any country. “La uridu” — I do not want, thank you. “La aʿrif” — I do not know, it happens. And the main one: “la afham” — I do not understand! That is not weakness. That is the cleverest phrase a student owns. The fool nods. The clever one says: la afham, marra thaniya, bibutʼ! And the whole world slows down for him.',
 w:['لا in front of the verb and the negation is done: لا أريد، لا أفهم، لا أعرف.',
    'Did not understand? Say so: مرة ثانية، ببطء.',
    'ما معنى؟ — “what does it mean?” — the brother of “ma haza”, but for words.'],
 p:'Say «لا أفهم» honestly out loud at least once today — even to yourself over an Arabic text.'},

8:{goal:'Say what you have, ask what the other person has, and offer it to a guest.',
 tt:'ʿIndi — “I have”, with no verb for having',
 t:['Arabic has no verb “to have” — and it does not need one. عند means “at”, عندي means “at me”. عندي شاي is literally “at me tea”: you name who, you name what, the sentence is finished.',
    'عندك is “you have”. Look closely at the tails: ـي is “my / me”, ـك is “your / you”. Remember this pair — very soon you will see it on every other word and discover you already know it.',
    'عندي is not only for objects: عندي وقت — I have time, عندي فكرة — I have an idea, عندي مشكلة — I have a problem. Three phrases that turn up in Arabic drama every five minutes.'],
 voice:'See how convenient. The English have “I have”, the Germans “ich habe” — whole verbs, conjugations, suffering! And we have: ʿindi. At me. That is all! ʿindi shay — I have tea. ʿindi fikra — I have an idea. ʿindi waqt? No, my friend, waqt is exactly what I do not have — I have a guest and only one teapot. Now that is a mushkila.',
 w:['عندي — “I have”, عندك — “you have”. No verb for having is needed.',
    'The tails ـي “my” and ـك “your” will soon be everywhere.',
    'عندي وقت / فكرة / مشكلة — the three liveliest phrases with ʿindi.'],
 p:'Say عندي + the word about three things near you. Properly, out loud.'},

9:{goal:'Talk about your family from a photo and address a woman correctly.',
 tt:'Ta marbuta — the letter that makes a word feminine',
 t:['A little circle with two dots at the end of a word — ة, “ta marbuta” — almost always means the feminine: صديق “friend” → صديقة “female friend”. One letter instead of a separate word. Hear an “-a” at the end and it is probably about a woman.',
    'That is why “who is this?” splits in two: من هذا؟ about a man, من هذه؟ about a woman. You have known هذا since lesson two — هذه is its sister.',
    'And what was promised in lesson one: to a woman you say وأنتِ — “wa anti”, with an “i” at the end. كيف حالك؟ sounds “haluk” to a man and “haluki” to a woman. One sound of difference, and a whole conversation of respect.'],
 voice:'Family, my friend, is the first thing you will be asked about. Not “what do you do” — “how is your mother? your father? how many brothers?” You show a photo and say: haza abi, hazihi ummi. And remember: to Hajja Amina upstairs you say “wa anti”, not “wa anta”. One sound! And for that sound she brings you a tray with lunch. Tested.',
 w:['ة at the end makes the word feminine: صديق → صديقة.',
    'هذا about a man, هذه about a woman.',
    'To a woman: وأنتِ، كيف حالكِ — with “i” at the end.'],
 p:'Open a family photo and name three people in Arabic: هذا… هذه…'},

10:{goal:'Invite someone over, accept an invitation and agree a time by ear.',
 tt:'Taʿal — and a deal sealed with “in sha Allah”',
 t:['تعال is “come”. It is a command, but a warm one: paired with تفضّل it sounds like an embrace, not an order. تعال إلى بيتي — “come to my house”. Assemble بيتي yourself: بيت “house” plus the familiar tail ـي “my” from earlier lessons.',
    'متى؟ — “when?”. The answers are ready: اليوم “today”, غدًا “tomorrow”. Three words and the arrangement is made.',
    'And the main thing. To any plan about the future an Arab answers إن شاء الله — “if God wills”. This is not “maybe” and not an excuse, whatever tourists think. It is respect for the fact that the future is not in our hands. You said “ghadan?”, you heard “in sha Allah” — that means you have properly agreed.'],
 voice:'Yunus said to me today: taʿal ila bayti! Come to my place, he says. I nearly dropped the teapot. Yesterday he could not pronounce “salam” — today he invites me over! I asked: mata? He says: ghadan, in sha Allah. He said it exactly right. With “in sha Allah”. Because the future belongs to God — and the tea is today. ʿAjeeeb!',
 w:['تعال — “come”; تعال إلى بيتي is the whole invitation.',
    'متى؟ → اليوم / غدًا — an arrangement in three words.',
    'Plans are sealed with «إن شاء الله» — and that is agreement, not an excuse.'],
 p:'Invite someone over with a full Arabic sentence: تعال إلى بيتي غدًا!'},

11:{goal:'Say where you are going and ask someone else the same.',
 tt:'إلى — the arrow of direction',
 t:['«إلى» is the preposition “to, towards” — an arrow of movement: «أذهب إلى السوق», “I am going to the market”. The question assembles itself out of parts you already own: «إلى أين؟» — “where to?”, literally “to where”.',
    'Notice that the places all carry «الـ»: السوق، البيت، المسجد. Remember THE key from lesson four? When you say “I am going to the market” you mean your own, familiar market — which is why the article lives here permanently.',
    '«أذهب» means “I go”. For now it is just a label on a word. In the next lesson it turns out to be the door into a whole system — but let us not run ahead.'],
 voice:'Ila ayna, my friend? Where are you off to? That is the first question the street asks you. And look how simple the answer is: adhhabu ila s-suq. I am going to the market. Adhhabu ila l-masjid. Adhhabu ila l-bayt. One little arrow, ila, and the whole city is yours. Where am I going? To the shop. For dates. Again. Anza ate the last ones.',
 w:['«إلى» — “to, towards”: the arrow of direction.',
    '«إلى أين؟» — “where to?”; the answer is «أذهب إلى» + a place.',
    'Places travel with «الـ»: السوق، البيت، المسجد.'],
 p:'On your way out of the house today, say out loud where you are going: أذهب إلى...'},

12:{goal:'Say what you are doing right now — about yourself, the person opposite you and a third person.',
 tt:'Three engine letters: أ، ت، ي',
 t:['Look at three words: أذهب، تذهب، يذهب. The root is one and the same — ذهب, “to go”. Only the first letter changes: «أ» means “I”, «ت» means “you”, «ي» means “he”. This is not a conjugation table — these are three stickers on one verb.',
    'And now the trick: the stickers work on any verb. «أشرب» I drink → «تشرب» you drink → «يشرب» he drinks. أعمل → تعمل → يعمل. Understand it once and every verb in the course hands you three forms for free.',
    'The familiar «أريد» from lesson three belongs to the same family: أ + ريد. You have been conjugating verbs since lesson three without knowing it.'],
 voice:'Let me tell you a secret, my friend. You think Arabic verbs are frightening? Watch. Adhhab — I go. Tadhhab — you go. Yadhhab — he goes. Alif is me. Ta is you. Ya is him. Three letters! I have been drinking tea for thirty years — ashrab. You drink — tashrab. Yunus drinks — yashrab. Even Anza… no. Anza does not drink tea. Anza eats my dates.',
 w:['«أ» = I, «ت» = you, «ي» = he — the first letter of the verb names who is doing it.',
    'The stickers work on any verb: أشرب → تشرب → يشرب.',
    '«أريد» from lesson 3 is the same system: you have been conjugating all along.'],
 p:'Take the verb “to drink” and run it out loud over real people: I drink, you drink, he drinks.'},

13:{goal:'Survive a taxi: give the address, command “right, left, straight” and stop where you need to.',
 tt:'Command words: the imperative without the rules',
 t:['Nobody conjugates in a taxi — in a taxi you command. «يمين» right, «يسار» left, «إلى الأمام» straight ahead, «قف» stop. This is the imperative mood, but there is no need to study it as a topic: four commands cover the whole road.',
    'Politeness is compulsory. A bare command sounds sharp, so: «قف هنا من فضلك» — “stop here, please”. The formula “command + min fadlik” turns an order into a request.',
    'The familiar «تعال» from lesson ten is a command too — “come”. You are already using the imperative: تفضّل، تعال، قف. The system will assemble itself, word by word.'],
 voice:'A taxi is theatre, my friend. You get in and you say: ila s-suq, min fadlik. After that three words decide everything: yamin! yasar! ila l-amam! And the finale: qif huna. Stop here. That is it — you have arrived. Karim the driver will say mashallah, where did you get Arabic? — and you say proudly: min Ajeebus. No. Do not say that. Just smile.',
 w:['يمين، يسار، إلى الأمام، قف — four words steer any car.',
    'Command + «من فضلك» = a polite request.',
    '«تفضّل» and «تعال» — you have been speaking in the imperative for a while now.'],
 p:'On the road today, call out the turns to yourself in Arabic: yamin… yasar… amam.'},

14:{goal:'Ask and tell the time, and agree on an hour to meet.',
 tt:'As-saʿa + a number, and the time is done',
 t:['«كم الساعة؟» — “what time is it?”, literally “how many the hour?” — our old «كم» from lesson six. The answer: «الساعة الخامسة», “the fifth hour”. Every hour has a name-label built from a number you know: الواحدة one o’clock, الثانية two, الثالثة three, الخامسة five. Learn them as labels, the way you will learn the days — no number grammar attached.',
    'Half past is «والنصف»: «الساعة الخامسة والنصف» — “half past five”. First the whole hour, then the half on top: honest arithmetic. Morning and evening are the little tails «صباحًا» and «مساءً».',
    'On the street you will also hear the shortcut «الساعة خمسة» — “hour five”. Understand it when it flies at you, but answer with the full form: this course speaks fusha everywhere, and «الساعة الخامسة» is correct in every country and every book.'],
 voice:'Kam as-saʿa, my friend? You do not know? Well, Yunus knows now! As-saʿa al-khamisa — five o’clock. As-saʿa al-khamisa wa-n-nisf — half past five. See how honest that is: first the whole hour, then the half laid on top. None of your “half of an hour that has not happened yet”. Arab precision. Tea, by the way, brews for exactly four daqiqa. That is precision too.',
 w:['«كم الساعة؟» — “what time is it?”; the answer: «الساعة الخامسة» — hour-labels built from numbers.',
    '«والنصف» — “and a half”; «صباحًا» / «مساءً» — in the morning / in the evening.',
    'The literary form with ordinals comes later — the spoken one is understood everywhere.'],
 p:'Three times today answer the question “kam as-saʿa?” out loud — in Arabic.'},

15:{goal:'Name the days of the week and arrange to meet on a particular day.',
 tt:'The days of the week are numbers you already know',
 t:['Look carefully: «الأحد» Sunday — from «واحد», one. «الاثنين» Monday — from «اثنان», two. «الثلاثاء» from «ثلاثة» three, «الأربعاء» four, «الخميس» five. The Arabic week is simply numbered! The same trick as the hour-labels from the last lesson: numbers wearing name-clothes. You learned the days of the week back in lesson six — you just did not know it.',
    'Only two are special: «الجمعة» Friday, the day of gathering (from the same root as “assembly”), the chief day of the week. And «السبت» Saturday, the day of rest, a relative of “sabbath”.',
    'The preposition «في» puts all of it into time: «في يوم الجمعة» — “on Friday”. The same «في» also says “in the house”: one preposition for place and time alike.'],
 voice:'And now the trick, my friend! You know the days of the week. You do not believe me? Ahad — what is that? Wahid, one! The first day. Ithnayn — ithnan, two! Thulatha — thalatha! The Arabs did not agonise over names: they numbered them and went to drink tea. Only Friday is special — jumʿa, the day everyone gathers. And Saturday — sabt, rest. Five days for free, my friend. For free!',
 w:['The days are numbers: الأحد=1, الاثنين=2, الثلاثاء=3…',
    'The special ones: «الجمعة» the day of gathering, «السبت» the day of rest.',
    '«في» — “in, on”: في يوم الجمعة، في البيت.'],
 p:'Say today’s day and tomorrow’s out loud: اليوم… غدًا…'},

16:{goal:'Place a full, polite order in a café and ask for the bill.',
 tt:'Min fadlik opens any door',
 t:['«من فضلك» is “please”, literally “out of your kindness”. The ordering formula: first what, then the magic word — «عصير من فضلك», “juice, please”. «شاي من فضلك». «الحساب من فضلك» — “the bill, please”, the phrase that ends every café on earth.',
    '«بدون» is “without”: «شاي بدون سكر», tea without sugar. One word and the order became precise. And «سكر» is the ancestor of the word for sugar in almost every language: sugar, Zucker, şeker — all of them came from Arabic. You have known this word your whole life.',
    'Addressing a woman — say at the till: «من فضلكِ», min fadliki. The familiar “-i” from lesson nine works here too.'],
 voice:'In a café, my friend, it is not your accent that gives you away. It is rudeness! Never just “shay!”. Always: shay, min fadlik. Want it without sugar — shay bidun sukkar. And sukkar… sugar… do you hear it? We gave you that, along with the word! Drink it in good health. And the bill — al-hisab, min fadlik. And a smile. A smile is half of the Arabic language.',
 w:['An order = the thing + «من فضلك»: عصير من فضلك.',
    '«بدون» — “without”: شاي بدون سكر.',
    '«الحساب من فضلك» — this is how every café ends.'],
 p:'Place today’s order — even if only in your head — entirely in Arabic, with “min fadlik” at the end.'},

17:{goal:'Ask for permission, a favour or a thing with a single word — and understand the answer.',
 tt:'Mumkin — the Swiss army knife of asking',
 t:['«ممكن» means “possible” — and in a question it becomes the universal “may I?”. The formula could not be simpler: «ممكن» + whatever you want. «ممكن ماء؟» — may I have water? «ممكن صورة؟» — may I take a photo? «ممكن هنا؟» — may I sit here? A noun, a place, anything at all.',
    'The answers come in a pair: «طبعًا» — “of course” (you will hear this most often; Arab politeness is generous), and «للأسف، لا» — “unfortunately, no” (a refusal is always softened).',
    'How does «ممكن» differ from «أريد»? “Urid” declares a wish, “mumkin” asks permission. The first is about you, the second about the other person. That is why “mumkin” sounds gentler and opens more doors.'],
 voice:'If they forced me to leave my student one single word — one! — I would leave him “mumkin”. Mumkin maʼ? May I have water? Mumkin sura? May I take a picture? Mumkin huna? May I sit here? One word, and the whole world answers you: tabʿan! Of course! Arabs rarely say no, my friend. And if they do, it is lil-asaf, la. With regret. Because refusing a guest hurts.',
 w:['«ممكن» + a word = any request: ممكن ماء؟ ممكن صورة؟',
    'The answers: «طبعًا» of course / «للأسف، لا» unfortunately, no.',
    '«أريد» is a wish, «ممكن» is permission. The second is gentler.'],
 p:'Ask for something today with “mumkin” — and count how many times you hear “tabʿan”.'},

18:{goal:'Say where you live and where you are from, and ask the same of someone else.',
 tt:'The verb and its preposition travel together',
 t:['«أسكن في» — “I live in”: the verb سكن always brings the preposition في along. Learn them as one long word: «أسكن في المدينة», “I live in the city”. The familiar «ت» from lesson twelve gives you the question: «أين تسكن؟» — “where do you live?”',
    'Origin goes through «من», “from”: «من أين أنت؟» — “where are you from?”, literally “from where you”. The answer: «أنا من» + a country — and country names in Arabic sound almost the way they do in your own language. That is a gift.',
    'Now build the story of yourself out of three lessons: أنا يونس. أنا من موسكو. أسكن في القاهرة. Three sentences, and the stranger on the bench is already someone you are talking to.'],
 voice:'Min ayna anta, my friend? Where are you from? They will ask you that a thousand times. And look at the beautiful answer you can give now: ana min Rusiya. Askun fi l-Qahira. I am from Russia, I live in Cairo. That is all! The old man on the bench is already pouring you tea from his flask and telling you about his grandchildren. Three sentences open hearts, my friend.',
 w:['«أسكن في» — learn it as one piece: verb plus preposition.',
    '«من أين أنت؟» → «أنا من» + a country.',
    'Three sentences about yourself: name, origin, where you live.'],
 p:'Assemble your own introduction — name, country, city — and say it in one go, without pauses.'},

19:{goal:'Pay, ask for your change and admit honestly that you have no money.',
 tt:'Ma ʿindi — a “no” of its own',
 t:['In lesson seven we negated verbs with «لا»: لا أريد، لا أفهم. But «عندي» is not a verb — it is “with me” (remember: that phrase has no verb in it at all). So it gets its own negation: «ما عندي» — “I do not have”. «ما عندي نقود» — I have no money. «ما عندي وقت» — I have no time.',
    'The rule is simple: «لا» for verbs, «ما» for «عندي». Two noes for two cases, and an Arab ear will not let you mix them: “la ʿindi” sounds as odd as “not I have”.',
    'The till, in words: «أدفع» — “I pay” (that familiar «أ»!), «الباقي» — “the change”, literally “the remainder”. «الباقي لك» — “keep the change”, literally “the remainder is yours”. One second, and you are a generous man.'],
 voice:'Disaster, my friend. I am at the till, basket full of dates, I reach for my wallet — and it is not there! So I say it honestly, loudly, like a man: ma ʿindi nuqud! I have no money! And then Yunus — my Yunus! — takes out his wallet and says: ana adfaʿ. I am paying. The student paying for the teacher! I almost wept. Then I remembered: that is my money, I lent it to him yesterday. Never mind. It was beautiful.',
 w:['«لا» for verbs, «ما» for «عندي»: ما عندي نقود.',
    '«أدفع» — “I pay”, «الباقي» — “the change”.',
    '«الباقي لك» — “keep the change”: generosity in one second.'],
 p:'Check your pockets and tell the truth in Arabic: عندي نقود — or ما عندي.'},

20:{goal:'Give a reason: answer “why?” with a full sentence.',
 tt:'Li-anna glues two sentences together',
 t:['«لماذا؟» — “why?”. Until this lesson all you could do was fall guiltily silent. Now you have «لأن», “because”: «أنا متأخر لأن الحافلة متأخرة» — “I am late because the bus is late”. Two thoughts became one sentence — the first complex syntax of the course.',
    'Notice the pair متأخر / متأخرة: one about a man, one about the bus (the word «حافلة» is feminine — there is the ة!). Lesson nine is doing its work.',
    '«آسف» — “sorry” — is for now just a polite word standing next to being late. A full apology with the past tense gets a lesson of its own: we have sown it, it will grow.'],
 voice:'Limadha, asks Hajja Amina, limadha mutaʼakhkhir?! Why are you late?! And here, my friend, you must not stay silent. Silence is guilt. Say it: li-anna! Because! Li-anna l-hafila mutaʼakhkhira! The bus was late! Li-anna Anza… no. Do not mention Anza. Nobody believes the goat. Although it is always the goat.',
 w:['«لماذا؟» — “why?”, «لأن» — “because”.',
    '«لأن» glues two sentences into one — your first complex phrase.',
    'متأخر / متأخرة — gender agreement is already working on its own.'],
 p:'Say today’s “because” in Arabic: لأن… — about the weather, about the traffic, anything.'},

21:{goal:'Describe a thing and a person: big, small, new, old, beautiful.',
 tt:'First what, then which',
 t:['The word order is the reverse of what you expect: «بيت كبير» is literally “house big”. First the thing, then the description. Always. You get used to it in a day, because the order is iron — no exceptions.',
    'The adjective adapts to gender: «بيت كبير» a big house, but «مدينة كبيرة» a big city — the word مدينة is feminine, and the adjective takes the ة after it. The ta marbuta from lesson nine now works on agreement.',
    'And pairs for the memory: كبير/صغير، جديد/قديم، طويل/قصير. Adjectives live in pairs of opposites — learn them in twos and they come back twice as easily.'],
 voice:'Yunus bought a jacket, my friend. He comes in and asks: how is it? And I look — the jacket is jadida, jamila… but kabira! Big! He stands in it the way I stand in a tent. So I said honestly: al-jacket jamil… wa kabir. Beautiful and big. Honesty, my friend, is part of the language too. He wears it with a belt now. Tayyib. The main thing is that it is warm.',
 w:['The order is iron: first the thing, then the description — بيت كبير.',
    'A feminine word takes a feminine adjective: مدينة كبيرة.',
    'Learn adjectives in pairs of opposites.'],
 p:'Describe three things around you with “thing + which”: كتاب قديم، بيت كبير…'},

22:{goal:'Say out loud that something is beautiful — in Arabic, and meaning it.',
 tt:'Ma ajmal — the formula of wonder',
 t:['«ما أجمل» + a thing = “how beautiful… !”: «ما أجمل المنظر!» — what a view! «ما أجمل البحر!» — what a sea! Do you recognise «أجمل»? It is «جميل», beautiful, from the last lesson, in a special form. One formula, endless wonder.',
    'And a word you knew before this course began: «ما شاء الله» — “what God has willed”. It is said when admiring — a child, a house, a success — so that the admiration is a blessing and not an evil eye. If you praise someone’s child, add mashallah: this is not superstition, it is care.',
    'Grammar today: none. That is deliberate. There is a wedding in the neighbourhood — Khaled is playing, the courtyard is strung with lights — and all you have to do is admire it out loud. One more wedding word to catch by ear: «مبروك» — “congratulations!”.'],
 voice:'A wedding in our alley, my friend! Khaled played the oud, the courtyard was strung with lights, the trays never stopped coming. And Yunus stood there and — on his own, I did not prompt him! — said: ma ajmal! And then quietly, over the lights and the singing: ma shaʼa Llah. And that, my friend, was when I knew. That is it. The man has begun to speak. Not with words — with his heart. Grammar can be learned. Wonder can only be felt.',
 w:['«ما أجمل» + a thing = “how beautiful!”',
    'Praising something of someone else’s — add «ما شاء الله»: admiration without the evil eye.',
    'No grammar today — you have earned it.'],
 p:'Find one beautiful moment today and say it out loud: ما أجمل…!'},

23:{goal:'Say whose it is: mine, yours, his, hers — with one sound on the end of the word.',
 tt:'One letter instead of the word “my”',
 t:['Where other languages need a separate word for “my”, Arabic makes do with one sound at the end: «كتابي», kitabi. «ـي» is “my”, «ـك» “your”, «ـه» “his”, «ـها» “her”. The book stays the same, the tails change: كتابي، كتابك، كتابه، كتابها.',
    'And here is the moment we have been sowing for: «عندي» and «عندك» from lesson eight are THE SAME tails! عند+ي “with me”, عند+ك “with you”. «بيتي» from lesson ten is بيت+ي. You have been using this system for fifteen lessons. Today you simply recognised its face.',
    'A quick quarrel about property: «لمن هذا؟» whose is this? — «هذا لي» this is mine — «لا، هذا لي!» no, this is MINE! After that let Hajja Amina decide.'],
 voice:'There is a scandal in the courtyard, my friend! Bilal is shouting: al-kura li! The ball is mine! The other one shouts: la, hadhihi kurati! So out I come and say wisely: liman hadhihi l-kura? Whose is this ball? And they both went quiet. Because the ball, my friend… the ball turned out to be Anza’s. She was already eating it. The moral: while you argue over the tails of “mine” and “yours”, the goat settles the matter on the merits.',
 w:['«ـي» my, «ـك» your, «ـه» his, «ـها» her — tails instead of words.',
    '«عندي» and «بيتي» are the same system: you have been inside it since lesson eight.',
    '«لمن هذا؟» — «هذا لي»: a property dispute in two words.'],
 p:'Walk round the room and name five things with a tail: كتابي، مفتاحي، بيتي…'},

24:{goal:'Complain about how you feel and understand someone else’s complaint.',
 tt:'Illness is “had”: ʿindi back on duty',
 t:['In Arabic pain does not “hurt” — you “have” it: «عندي صداع», “I have a headache”. The familiar construction from lesson eight has simply taken on new work. «عندي زكام» — I have a cold. One pattern, different words.',
    'The whole state goes through the familiar verbless sentence: «أنا مريض», I am ill (a woman says «مريضة» — the ة on duty again). To ask after health: «كيف صحتك؟» — a close brother of “kayfa haluk” from lesson two.',
    'And a cultural pearl: hearing of an illness, an Arab answers «سلامتك» — “your health”, a wish for recovery. The reply to it is «الله يسلمك». A pair, like salam: a complaint without “salamtak” in return is like a greeting without an answer.'],
 voice:'Kayfa sihhatuk, my friend? How is your health? If it is good — alhamdulillah! If it is bad, say so plainly: ʿindi sudaʿ. My head hurts. And at once they will say salamtak! Get well! And bring you ginger tea, and honey, and more tea, and Hajja Amina will bring soup… Being ill in an Arab house, my friend, is almost a holiday. Almost. Better not to be ill.',
 w:['Pain is “had”: عندي صداع.',
    '«أنا مريض» / «مريضة» — your state in a verbless sentence.',
    'A complaint is answered with «سلامتك» — “get well”.'],
 p:'Ask someone “كيف صحتك؟” today — and hear the answer out to the end.'},

25:{goal:'Explain to a doctor what happened and how long ago; understand the words for “more than one”.',
 tt:'Words in pairs, and the magic tail -ayn',
 t:['The Arabic plural is capricious, so here is our arrangement: every word arrives with its pair, like an irregular verb in English. «يوم» day — «أيام» days. Not a rule — a pair. Hear a new pair, put it in the jar.',
    'And here is a gift almost no other language has: the dual. “Two days” is not “ithnan yawm” but a single word, «يومين», yawmayn. The tail -ayn means “a pair”: «ساعتين» two hours, «أسبوعين» two weeks. Beautiful and economical.',
    'The doctor needs all of this for one question: «منذ متى؟» — “since when?”. The answer: «منذ يومين» — “for two days now”. The prescription arrives with «حبة كل يوم» — one pill every day.'],
 voice:'Doctor Samir is a good man, but his questions are always the same. Mundhu mata? How long? And you must answer precisely: mundhu yawmayn. Two days. Do you hear the beauty of it? Not “two days” in two words — in one! Yawm-ayn. The tail -ayn, and everything doubled. The Arabs even have a number just for pairs. For a pair of eyes, a pair of hands, and a pair of days with a sore head.',
 w:['The plural comes as a pair to the word: يوم — أيام.',
    'The tail -ayn = “a pair”: يومين، أسبوعين.',
    '«منذ متى؟» — “since when?”; «منذ يومين» — “for two days”.'],
 p:'Say in Arabic how long you have been learning Arabic: منذ…'},

26:{goal:'Invite by asking, accept with delight and refuse without offending.',
 tt:'Tuhibb? — an invitation shaped as a question',
 t:['«تحب شاي؟» — “would you like tea?”, literally “do you love tea?”. No question particle at all — only the intonation lifted at the end: that is how this course has been asking since lesson one. «أحب» is “I love”: أحب الشاي، أحب هذه المدينة.',
    'Agreement, with delight: «نعم، أحب!» or «فكرة ممتازة!» — “an excellent idea!” (both words are familiar: فكرة from lesson eight, and ممتاز is new but indestructibly useful).',
    'A refusal is always soft, in three steps: «للأسف» from lesson seventeen, «ربما» maybe, «وقت آخر» another time. A flat “no” to an invitation is close to rude in Arab culture; “another time” is the polite “no”, and both sides understand it.'],
 voice:'My neighbour Khaled is a musician. Plays loudly, but a heart of gold. Yesterday he asks: tuhibb qahwa? Would you like coffee? And I… I made a mistake, my friend — I said: uhibb! I love it! And I am a tea man! But to refuse a neighbour… I drank it. And I will tell you honestly: Khaled’s qahwa is a fikra mumtaza. Just do not tell Yunus. He and I have a tea tradition.',
 w:['«تحب» + a thing؟ — an invitation by question, by intonation.',
    'Agreement: «فكرة ممتازة!» Refusal: «للأسف… وقت آخر».',
    'A flat “no” to an invitation is rude; “another time” is the polite one.'],
 p:'Offer someone something with “tuhibb…?” — and watch the conversation get warmer.'},

27:{goal:'Arrange a meeting in full: the day, the hour and the place in one sentence.',
 tt:'Building a meeting out of ready parts',
 t:['Almost nothing is new today, and that is deliberate. A complete arrangement assembles itself from what you already have: «في يوم الجمعة» (lesson 15) + «الساعة الخامسة» (lesson 14) + «أمام المقهى» (the café you already know). The result: «موعدنا في يوم الجمعة، الساعة الخامسة، أمام المقهى».',
    'Only the joints are new: «إذن» — “so, then” — sums up (“idhan, Friday at five”), and «اتفقنا» — “agreed!” — puts the seal on it. Once you hear “ittafaqna”, the meeting is happening.',
    '«أمام» means “in front of”: «أمام المقهى» — in front of the café. You met its cousin in the taxi — «إلى الأمام», “to the front”, straight ahead. Same word at the core, two jobs.'],
 voice:'Look, my friend, at what you can do — on your own, without me! Fi yawm al-jumʿa: you have the day. As-saʿa khamsa: you have the hour. Amam al-maqha: you have the place. Idhan… ittafaqna! Agreed! A whole meeting, a real grown-up one, out of pieces you have been collecting for fifteen lessons. That is how a language is built: brick by brick, and then suddenly — a house.',
 w:['A meeting = day + hour + place: you have had all the parts for a while.',
    '«إذن» sums up, «اتفقنا» puts the seal on it.',
    '«أمام» — “in front of”; the taxi’s «إلى الأمام» is the same word doing its other job.'],
 p:'Fix your next real meeting in Arabic — day, hour, place — and close it with “ittafaqna”.'},

28:{goal:'Hold a phone conversation: answer, ask them to wait, explain that someone is busy.',
 tt:'He and she by ear: the engine letters keep working',
 t:['The telephone ritual: «ألو» → «من معي؟» who is speaking? (literally “who is with me” — that familiar tail «ـي»!) → «لحظة من فضلك» one moment please. Three lines, and you can hold a conversation with no gestures at all.',
    'The main grammar: talking about a third person. «يجيب» — “he answers”, the familiar «ي» from lesson twelve. She: «تجيب». Wait, you will say, «ت» means “you”! It does — the letter «ت» works twice, for “you” and for “she”, and context tells you which. Arabic is economical: «أحمد لا يجيب» Ahmad is not answering, «أمي لا تجيب» my mother is not answering.',
    'Wrong number: «الرقم خطأ» — “the number is wrong”. Apologise (آسف), hang up, no harm done.'],
 voice:'I call Yunus — la yujib. No answer! I call again — la yujib! Now I am worried, the kettle is going cold! I call a third time… Alu! Man maʿi?! I shout. And it is not Yunus. It is Hajja Amina. Raqm khataʼ, she says, wrong number, my dear. And then twenty minutes about her grandchildren. That was a good wrong number, my friend. A warm one.',
 w:['The ritual: «ألو» → «من معي؟» → «لحظة من فضلك».',
    '«ي» is “he”, «ت» is “you” and “she”: context tells you which.',
    '«الرقم خطأ» — “wrong number”: apologise and that is that.'],
 p:'Start your next phone call, silently, in Arabic: alu, man maʿi?'},

29:{goal:'Apologise, admit fault and accept an apology.',
 tt:'The tail -tu: the first door into the past',
 t:['Until now the whole course has lived in the present. Today, the first step back in time: «نسيت» I forgot, «فعلت» I did, «كسرت» I broke. Do you hear the common tail? «ـتُ», “-tu”, on the end of a verb means “I did this in the past”. The present is built with prefixes at the front (أ، ت، ي), the past with tails at the back. For now we take only “I”; the rest can wait.',
    'An apology in Arabic has two storeys: «آسف» “I am sorry” — a state, and «سامحني» “forgive me” — a request (a familiar command, like قف and تعال, only warm). The full formula: «آسف، نسيت» — sorry, I forgot.',
    'To accept an apology: «لا بأس», “no harm” (literally “no harm done”). And to admit that the other person is right, the most beautiful idiom of all: «الحق معك» — “the truth is with you”. Not “you won the argument” — the truth is simply standing beside you. After those words there is nothing left to quarrel about.'],
 voice:'Khaled and I fell out, my friend. Over nothing: he played the oud at midnight, I said one word, he said two… Three days without a greeting. Three days, imagine that! Neighbours! Then Bilal came, the boy from the courtyard, looked at the two of us and said: you are both ridiculous. So I went to Khaled and said: samihni. Asif. And he said: la baʼs… al-haqq maʿak, I did play late. And I said: la, al-haqq maʿak! And we argued about which of us was the one in the wrong until the tea went cold. That was a good quarrel. A proper one.',
 w:['The tail «ـتُ» = “I did”: نسيت، فعلت، كسرت.',
    'An apology: «آسف» + «سامحني». The answer: «لا بأس».',
    '«الحق معك» — “the truth is with you”: after that, people stop quarrelling.'],
 p:'If there is someone to say it to — apologise in Arabic today: آسف، نسيت. It counts even if they do not understand the words: they will understand the tone.'},

30:{goal:'Say how things used to be — “was, were” — and close the season with a reconciliation.',
 tt:'Kana — the time machine',
 t:['Remember the first rule of the course, the sentence with no verb — «البيت كبير», the house is big? Add «كان» and it drives off into the past — and the description picks up a little song on the end: «كان البيتُ كبيرًا», kana l-baytu kabiran. «الشاي ساخن» the tea is hot → «كان الشاي ساخنًا», the tea was hot — sakhinan. That «-an» is kana’s signature tune: hear kana at the front, sing “-an” on the description. Why it happens is a story for a much later level; for now it is simply how the phrase is pronounced.',
    'The feminine comes with a familiar letter: «كانت» — «كانت المدينة صغيرة», the city was small (words ending in ة keep their usual sound, no song needed). And the tail from the last lesson gives you “I was”: «كنت» — «كنت مريضًا», kuntu maridan — I was ill, «كنت في السوق» I was at the market.',
    '«أمس» — “yesterday” — is the past tense’s chief companion. And a word for the end of the season: «صحيح», “true”. «كان الحق معك» — “the truth was with you”. The season of quarrels and reconciliations is closed.'],
 voice:'Zaman, my friend… long ago… I was young. Kuntu saghiran! Kuntu tawilan… no, tall I never was, I will not lie to you. But listen to the power of this: kana. Was. Kana sh-shay sakhinan — the tea was hot. Kanat al-madina saghira — the city was small. One word, and you are a storyteller! Your whole life, everything that was “before”, has opened up. Careful with that power: old men like me go into “kana” and do not come back.',
 w:['«كان» + a verbless sentence = the past, and the description sings “-an”: كان الشاي ساخنًا.',
    '«كانت» — “she was”, «كنت» — “I was”.',
    '«أمس» — “yesterday”: the chief companion of the past.'],
 p:'End the day with a sentence about it: كان اليوم… — and add the adjective the day has earned.'}
};

/* ---------- перевод реплик сцены: собираем словарь из лексики всех уроков ---------- */
const SCENE_EXTRA={'والآن':'and now','لا':'no','نعم':'yes','هيا':'come on','يا':'o','طيب':'all right',
 'آه':'ah','أهلا':'welcome','أهلاً':'welcome','هه':'ha','ممم':'mmm','شششش':'shh','انظر':'look',
 'هنا':'here','هناك':'there','ماذا':'what','كيف':'how','من':'who','أين':'where','ما':'what'};
const AR_DICT=(()=>{ const m=new Map();
  for(const P of (window.AJ&&window.AJ.program)||[]) for(const v of P.vocab||[]) m.set(stripAr(v.ar), gloss(v.ru));
  for(const k in SCENE_EXTRA) m.set(stripAr(k), SCENE_EXTRA[k]);
  return m; })();
/* Переводим только то, что реально знаем: строку разбираем на известные куски,
   и если хоть один кусок неизвестен — перевод не показываем вообще. */
function trLine(line){
  const clean=stripAr(line); if(!clean) return null;
  if(AR_DICT.has(clean)) return AR_DICT.get(clean);
  const words=clean.split(' ').filter(Boolean);
  const out=[]; let i=0;
  while(i<words.length){
    let hit=null;
    for(let len=Math.min(4,words.length-i); len>0; len--){
      const chunk=words.slice(i,i+len).join(' ');
      if(AR_DICT.has(chunk)){ hit={txt:AR_DICT.get(chunk),len}; break; }
    }
    if(!hit) return null;
    out.push(short(hit.txt)); i+=hit.len;
  }
  return out.join(' ');
}

/* -------- курс 2: последовательные разделы со списком уроков --------
   Кружки по змейке заменены на разделы: у каждой части своя шапка с обложкой
   и прогрессом, внутри — уроки строками. Видно, что человек умеет после каждого. */
function lessonRow(n,it,nxt){
  const has=!!prog(n), open=has&&unlocked(n), cur=(n===nxt&&open&&!done[n]);
  const P=has?prog(n):null;
  const meta=P?`${P.vocab.filter(v=>v.kind==='core').length} words · 1 rule · 7 min`:'in production';
  const mark=done[n]?'<span class="mk done">✓</span>'
    :(!has?'<span class="mk soon">•</span>'
    :(!open?'<span class="mk lock">🔒</span>':`<span class="mk num">${n}</span>`));
  if(cur) return `<button class="lrow cur" data-open="${n}">
      <span class="mk play">▶</span>
      <div class="lmid"><div class="lkick">Next lesson</div>
        <div class="ltit">${n}. ${esc(lTitle(n))}</div>
        <div class="lcan">${esc(lCan(n))}</div>
        <div class="lmeta">${meta}</div></div>
      <span class="startpill">Start</span></button>`;
  return `<button class="lrow ${done[n]?'is-done':''} ${(!has||!open)?'is-off':''}" data-open="${n}" ${has?'':'disabled'}>
      ${mark}
      <div class="lmid"><div class="ltit">${n}. ${esc(lTitle(n))}</div>
        <div class="lcan">${esc(lCan(n))}</div></div>

/* ================= УРОК (v6) ================= */
let F=null;
function buildSteps(n){
  const P=prog(n), L=AJ.lessons.find(l=>l.n===n);
  const steps=[{t:'intro'}];
  const core=P.vocab.filter(v=>v.kind==='core'), seeds=P.vocab.filter(v=>v.kind!=='core');
  core.forEach((v,i)=>{
    steps.push({t:'word',v});
    if((i+1)%3===0||i===core.length-1){
      const pool=core.slice(0,i+1);
      if(pool.length>=2){
        const target=pool[Math.floor(Math.random()*pool.length)];
        const opts=[target,...pool.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
        steps.push({t:'check',target,opts});
      }
    }
  });
  if(seeds.length) steps.push({t:'seeds',seeds});
  steps.push({t:'theory'});
  P.drills.forEach(d=>steps.push({t:'ex',d}));
  steps.push({t:'episode',L});
  steps.push({t:'wrap'});
  return steps;
}
function startFlow(n,jump){
  F={n,steps:buildSteps(n),idx:0,P:prog(n),M:flat.find(f=>f.n===n),timer:0,pct:0};
  if(jump==='episode'){const i=F.steps.findIndex(s=>s.t==='episode'); if(i>0)F.idx=i;}
  renderStep();
}
function next(){ if(!F) return; clearTimeout(F.timer);
  if(F.idx<F.steps.length-1){F.idx++; renderStep();} }
function requeue(s){ F.steps.push({...s,retry:true}); }
function autoNext(ms){ clearTimeout(F.timer);
  const c=$('#cta'); if(c&&(ms||2000)>=1800){c.classList.remove('auto'); void c.offsetWidth; c.classList.add('auto');}
  F.timer=setTimeout(next,ms||2000); }

function frame(inner,{cta='Continue',ctaOn=true,kicker='',q=''}={}){
  const raw=Math.round(F.idx/Math.max(1,F.steps.length-1)*100);
  F.pct=Math.max(F.pct||0,raw);
  $('#view').onclick=null;
  $('#view').innerHTML=`<div class="flow">
    <div class="fhead"><button class="fx" id="fx">✕</button>
      <div class="fbar"><i style="width:${F.pct}%"></i></div></div>
    <div class="fbody">
      ${kicker?`<div class="qkick">${esc(kicker)}</div>`:''}
      ${q?`<div class="q">${esc(q)}</div>`:''}
      ${inner}
    </div>
    <div class="fb" id="fb"><span class="fi"></span><div><div class="f1"></div><div class="f2"></div></div></div>
    <div class="ffoot"><button class="cta" id="cta" ${ctaOn?'':'disabled'}>${esc(cta)}</button></div>
  </div>`;
  $('#fx').onclick=exitFlow;
}
function feedback(good,sub){
  const fb=$('#fb'); fb.className='fb '+(good?'good':'bad');
  fb.querySelector('.fi').textContent=good?'✓':'✕';
  fb.querySelector('.f1').textContent=good?['Nice.','Correct.','ʿAjeeb!','Exactly.'][Math.floor(Math.random()*4)]:'Not quite';
  fb.querySelector('.f2').innerHTML=sub||'';
  $('#cta').disabled=false;
}

function renderStep(){
  const s=F.steps[F.idx], P=F.P;

  if(s.t==='seeds'){

    let answered=false;
    $('.opts').onclick=e=>{
      const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
      const ok=c.dataset.c===correct;
      c.classList.add(ok?'good':'bad');
      if(!ok){$$('[data-c]').find(x=>x.dataset.c===correct)?.classList.add('good'); requeue(s);}
      $$('.opt').forEach(x=>{if(x!==c)x.classList.add('ghost')});
      feedback(ok, ok?'':`It was: <span class="ar">${esc(correct)}</span>`);
      if(ok) autoNext(2000);
    };
    $('#cta').onclick=next; return;
  }

  if(s.t==='episode'){
    const L=s.L, scenes=L?L.shots.filter(x=>x.ar.length).slice(0,3):[];
    frame(`<div class="vplayer"><img src="${lessonImg(F.n)}" alt="">
        <div class="play"><span>▶</span></div>
        <div class="cap">${L?`Episode ${F.n} · 12 shots${F.n<=3?' · footage ready':''}`:`Episode ${F.n} — attached when the series catches up`}</div></div>
      <div class="subseg" id="sseg">
        <button data-sub="none" aria-pressed="true">No subtitles</button>
        <button data-sub="ar" aria-pressed="false">العربية</button>
        <button data-sub="ru" aria-pressed="false">AR + translation</button>
      </div>
      <div class="sublines" id="slines">
        ${scenes.map(x=>x.ar.map(a=>{const tr=trLine(a);
          return `<div class="subline"><div class="a ar">${esc(a)}</div>
          ${tr?`<div class="r" data-ru style="display:none">${esc(tr)}</div>`:''}</div>`;}).join('')).join('')
          ||'<div class="subline"><div class="r">Subtitles appear when the episode is attached.</div></div>'}
      </div>`,{kicker:'Episode',q:'Watch — you already know these words'});
    $('#sseg').onclick=e=>{const b=e.target.closest('[data-sub]'); if(!b)return;
      $$('#sseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#slines').classList.toggle('on',b.dataset.sub!=='none');
      $$('#slines [data-ru]').forEach(r=>r.style.display=b.dataset.sub==='ru'?'':'none');};
    $('#cta').onclick=next; return;
  }

  if(s.t==='wrap'){
    frame(`<div class="wrapend">
      <div class="medal">🏅</div>
      <h2 class="dsp">Lesson ${F.n} complete</h2>
      <div class="canlist">${(LT(F.n,'w')||P.wrap).map(w=>`<div class="cl">${bidi(esc(w))}</div>`).join('')}</div>
      <div class="today"><div class="p1">Phrase of the day</div><div class="p2">${bidi(esc(LT(F.n,'p')||P.phrase))}</div></div>
    </div>`,{cta:'Finish'});
    $('#cta').onclick=finishLesson; return;
  }
}

function boot(){ let seen=false; try{seen=!!sessionStorage.getItem('aj_salam')}catch(e){}
  if(seen) home(); else salam(); }
boot();
</script>
</body>
</html>
