<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajeebus — app prototype v2</title>
<style>
  :root{
    --bg:#F7F2E8; --card:#FFFFFF; --ink:#27211497; --ink2:#262014; --dim:#6E6250; --faint:#9A8D78;
    --line:#E7DECB; --em:#14806B; --em-dark:#0E6455; --em-soft:#E3F2EE; --gold:#C98A1B; --gold-soft:#FBF0DA;
    --clay:#C24C2C; --clay-soft:#FBE9E2; --ok:#2E8F53; --ok-soft:#E1F3E8; --lock:#CFC5B0;
    --shadow:0 1px 3px rgba(60,45,20,.08),0 8px 24px rgba(60,45,20,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font:16px/1.5 -apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif}
  body{background:#E9E1D1;color:var(--ink2)}
  .phone{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;
         display:flex;flex-direction:column;box-shadow:0 0 40px rgba(60,45,20,.12);overflow:hidden}
  .ar{font-family:'Geeza Pro','Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  .draft{background:#262014;color:#EFE7D6;font-size:10.5px;padding:5px 14px;text-align:center}
  .draft b{color:#F5C86A}

  /* ================= HOME ================= */
  .home{padding:20px 18px 40px;overflow-y:auto}
  .apphead{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:15px;background:var(--gold-soft);display:grid;place-items:center;font-size:25px;border:1px solid var(--line)}
  .apphead h1{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink2)}
  .apphead .sub{font-size:12.5px;color:var(--dim)}
  .streak{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
          padding:12px 15px;display:flex;align-items:center;gap:12px}
  .streak .f{font-size:26px}
  .streak .t1{font-weight:750;font-size:14px}
  .streak .t2{font-size:11.5px;color:var(--dim)}
  .season{margin:18px 0 4px}
  .seahead{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
  .seahead .n{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
  .seahead .t{font-size:16px;font-weight:750;color:var(--ink2)}
  .lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .lc{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      box-shadow:var(--shadow);position:relative;transition:.12s;color:var(--ink2)}
  .lc:active{transform:scale(.94)}
  .lc .num{font-size:15px;font-weight:800}
  .lc .lt{font-size:8.5px;color:var(--dim);text-align:center;padding:0 3px;line-height:1.15;
          overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lc.done{background:var(--ok-soft);border-color:#BFDECB}
  .lc.done .num::after{content:' ✓';color:var(--ok);font-size:11px}
  .lc.locked{opacity:.5;background:transparent;box-shadow:none}
  .lc .pay{position:absolute;top:5px;right:6px;font-size:9px}
  .freechip{font-size:9px;font-weight:800;color:var(--em);background:var(--em-soft);border-radius:6px;
            padding:1px 5px;position:absolute;top:5px;right:6px}

  /* ================= FLOW ================= */
  .flow{flex:1;display:flex;flex-direction:column;min-height:0}
  .fhead{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
  .fx{font-size:20px;color:var(--faint);width:32px;height:32px;flex:none}
  .fbar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
  .fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),#1B9E85);border-radius:99px;
          transition:width .35s cubic-bezier(.2,.8,.3,1)}
  .fbody{flex:1;overflow-y:auto;padding:10px 20px 20px;display:flex;flex-direction:column}
  .ffoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  .cta{width:100%;background:var(--em);color:#fff;font-size:16px;font-weight:800;letter-spacing:.02em;
       padding:15px;border-radius:16px;box-shadow:0 4px 0 var(--em-dark);transition:.1s}
  .cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--em-dark)}
  .cta:disabled{background:#D8CFBC;box-shadow:0 4px 0 #C4B9A2;color:#9A8D78}
  .feedback{margin:-4px -16px 10px;padding:13px 20px;display:none;align-items:flex-start;gap:10px}
  .feedback.good{display:flex;background:var(--ok-soft);color:var(--ok)}
  .feedback.bad{display:flex;background:var(--clay-soft);color:var(--clay)}
  .feedback .fi{font-size:20px;line-height:1}
  .feedback .ft1{font-weight:800;font-size:14.5px}
  .feedback .ft2{font-size:13px;margin-top:2px}
  .feedback .ft2 .ar{font-size:16px}

  .kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .prompt-q{font-size:18px;font-weight:750;color:var(--ink2);margin-bottom:16px}

  /* intro */
  .intro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .intro .big{width:96px;height:96px;border-radius:30px;background:var(--gold-soft);display:grid;place-items:center;font-size:52px}
  .intro h2{font-size:24px;font-weight:800;color:var(--ink2)}
  .intro .goal{font-size:14.5px;color:var(--dim);line-height:1.55;max-width:300px}
  .intro .meta{display:flex;gap:8px}
  .intro .meta span{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--card)}

  /* word screen */
  .word{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
  .wimg{width:200px;height:200px;border-radius:28px;display:grid;place-items:center;font-size:92px;
        background:radial-gradient(120% 120% at 30% 20%,#FDF6E4,#F1E3C4);border:1px solid var(--line);
        box-shadow:var(--shadow);margin-bottom:10px;position:relative}
  .wimg .ph{position:absolute;bottom:8px;font-size:8.5px;color:var(--faint);letter-spacing:.04em}
  .war{font-size:44px;line-height:1.5;color:var(--ink2)}
  .wtr{font-size:15px;color:var(--dim)}
  .wru{font-size:17px;font-weight:750;color:var(--em)}
  .wseed{font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:8px;padding:2px 9px;margin-top:4px}
  .spk{margin-top:12px;width:52px;height:52px;border-radius:50%;background:var(--em-soft);color:var(--em);
       font-size:21px;display:grid;place-items:center;border:1px solid #C4E2D9}
  .spk.playing{animation:pulse .6s infinite}
  @keyframes pulse{50%{transform:scale(1.14)}}
  .ttsnote{font-size:10px;color:var(--faint);margin-top:8px}

  /* choices */
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{border:2px solid var(--line);background:var(--card);border-radius:15px;padding:14px 16px;
          font-size:19px;text-align:center;box-shadow:0 2px 0 var(--line);transition:.1s;color:var(--ink2)}
  .choice:active{transform:translateY(2px);box-shadow:none}
  .choice.sel{border-color:var(--em);background:var(--em-soft);color:var(--em)}
  .choice.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .choice.bad{border-color:var(--clay);background:var(--clay-soft);color:var(--clay)}
  .choice.ghost{opacity:.4;pointer-events:none}
  .listenbtn{align-self:center;width:74px;height:74px;border-radius:24px;background:var(--em);color:#fff;
             font-size:30px;display:grid;place-items:center;box-shadow:0 4px 0 var(--em-dark);margin:6px 0 18px}
  .listenbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--em-dark)}

  /* match */
  .paircols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .paircols .choice{font-size:16px;padding:12px 8px}

  /* build */
  .slots{min-height:56px;border-bottom:2px solid var(--line);padding:8px 2px;margin-bottom:18px;
         display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chipw{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;
         font-size:19px;box-shadow:0 2px 0 var(--line);color:var(--ink2)}
  .chipw.ghost{opacity:.3;pointer-events:none}
  .slots .chipw{background:var(--em-soft);border-color:var(--em);color:var(--em)}

  /* theory */
  .theory{display:flex;flex-direction:column;gap:12px;margin:auto 0}
  .tvoice{display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #EFDDB4;
          border-radius:16px;padding:13px 15px}
  .tvoice .face{width:46px;height:46px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:22px;flex:none}
  .tvoice .t1{font-size:13.5px;font-weight:750;color:var(--ink2)}
  .tvoice .t2{font-size:11px;color:var(--dim)}
  .tvoice .pp{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#FFF8E9;
              display:grid;place-items:center;font-size:15px;flex:none}
  .wave{display:flex;gap:2.5px;align-items:center;height:22px;margin-left:6px}
  .wave i{width:3px;border-radius:2px;background:var(--gold);height:6px}
  .tvoice.playing .wave i{animation:eq .55s infinite ease-in-out}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
  .wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  @keyframes eq{50%{height:20px}}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
  .tcard h3{font-size:17px;font-weight:800;margin-bottom:9px;color:var(--ink2)}
  .tcard p{font-size:14.5px;line-height:1.62;color:var(--ink2)}
  .tcard p+p{margin-top:9px}
  .tcard details{margin-top:9px}
  .tcard summary{font-size:13px;font-weight:700;color:var(--em);cursor:pointer;list-style:none}
  .tcard summary::before{content:'▸ '}
  .tcard details[open] summary::before{content:'▾ '}
  .tcard details p{margin-top:8px;color:var(--dim)}

  /* say */
  .say{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .say .arb{font-size:32px;color:var(--ink2)}
  .say .mbtn{width:76px;height:76px;border-radius:50%;background:var(--clay);color:#fff;font-size:30px;
             box-shadow:0 5px 0 #8F3018}
  .say .mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8F3018}
  .say .mbtn.rec{animation:pulse .7s infinite}
  .say .mnote{font-size:11.5px;color:var(--faint)}

  /* seeds */
  .seedrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px dashed var(--line);
           border-radius:13px;padding:10px 13px;margin-bottom:8px;color:var(--ink2)}
  .seedrow .sa{font-size:19px;margin-left:auto}
  .seedrow .sr{font-size:12px;color:var(--dim)}
  .seedrow .sp{font-size:14px;color:var(--em)}

  /* episode */
  .vph{aspect-ratio:9/13;max-height:300px;border-radius:18px;background:
       radial-gradient(120% 90% at 30% 20%, #3A3326 0%, #221D14 70%);display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:10px;color:#D8CDB8}
  .vph .play{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
             display:grid;place-items:center;font-size:20px;color:#fff}
  .vph .cap{font-size:11.5px;opacity:.75;text-align:center;padding:0 20px;line-height:1.45}
  .subseg{display:flex;gap:6px;margin-top:12px}
  .subseg button{flex:1;font-size:11.5px;font-weight:650;padding:8px 4px;border-radius:11px;
                 border:1.5px solid var(--line);color:var(--dim);background:var(--card)}
  .subseg button[aria-pressed="true"]{background:var(--ink2);color:#F3EBDB;border-color:var(--ink2)}
  .sublines{margin-top:10px;display:none;flex-direction:column;gap:7px}
  .sublines.on{display:flex}
  .subline{border-left:2px solid var(--line);padding-left:9px;color:var(--ink2)}
  .subline .a{font-size:16.5px}
  .subline .r{font-size:11.5px;color:var(--dim)}

  /* wrap */
  .wrapend{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .wrapend .trophy{font-size:64px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}}
  .wrapend h2{font-size:22px;font-weight:800;color:var(--ink2)}
  .canlist{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;
           box-shadow:var(--shadow);padding:14px 16px}
  .canlist .cl{display:flex;gap:9px;font-size:13.5px;line-height:1.55;margin-bottom:7px;color:var(--ink2)}
  .canlist .cl::before{content:'✓';color:var(--ok);font-weight:800}
  .phrase{width:100%;background:var(--em-soft);border:1px solid #C4E2D9;border-radius:14px;padding:12px 15px;text-align:left}
  .phrase .p1{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--em);text-transform:uppercase;margin-bottom:3px}
  .phrase .p2{font-size:13.5px;line-height:1.5;color:var(--ink2)}
</style>
</head>
<body>
<div class="phone">
  <div class="draft"><b>DRAFT v2</b> · UI EN · content RU · voice = system TTS placeholder (final: native speaker)</div>
  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<script src="data.js"></script>
<script src="program.js"></script>
<script src="seasons.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(){try{return JSON.parse(localStorage.getItem('ajapp2')||'{}')}catch(e){return{}}},
  save(o){try{localStorage.setItem('ajapp2',JSON.stringify(o))}catch(e){}}};
let done=store.get().done||{};
const flat=AJ.seasons.flatMap(se=>se.items.map(i=>({n:i[0],title:i[1],goal:i[5],season:se})));
const prog=n=>AJ.program.find(p=>p.n===n);

/* ---------- TTS (черновик: системные голоса; в проде — носитель) ---------- */
let voices=[];
function loadVoices(){ voices=speechSynthesis.getVoices()||[]; }
loadVoices(); if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;
function speak(text,lang,rate){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=rate||0.82;
    const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.split('-')[0]));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
    return u;
  }catch(e){return null}
}
const stopSpeak=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ---------- эмодзи-заглушки картинок ---------- */
const EMO=[['чай','🫖'],['кофе','☕'],['вода','💧'],['сок','🧃'],['финик','🌴'],['сахар','🍬'],
 ['книга','📕'],['ручка','🖊️'],['ключ','🔑'],['кот','🐈'],['коз','🐐'],['дом','🏠'],['дверь','🚪'],

 ['мама','👩'],['отец','👨'],['брат','👦'],['сестра','👧'],['бабушка','👵'],['подруга','👭'],['друг','👬'],['кто это','🖼️'],
 ['один','1️⃣'],['два','2️⃣'],['три','3️⃣'],['четыре','4️⃣'],['пять','5️⃣'],['шесть','6️⃣'],['семь','7️⃣'],['восемь','8️⃣'],['девять','9️⃣'],['десять','🔟'],['сколько','🔢'],
 ['не хочу','🙅'],['не понимаю','😵‍💫'],['не знаю','🤷'],['ещё раз','🔁'],['помедленнее','🐢'],['что значит','❓'],['ладно','👌'],
 ['у меня','🤲'],['у тебя','🫵'],['время','⏳'],['идея','💡'],['гость','🛎️'],['проблема','😬'],
 ['приходи','🏃'],['когда','🗓️'],['сегодня','📅'],['завтра','🌅'],['мой дом','🏠'],['Аллах','🕋'],
 ['куда','🧭'],['иду','🚶'],['рынок','🛒'],['мечеть','🕌'],['работа','💼'],['кафе','☕'],
 ['направо','➡️'],['налево','⬅️'],['прямо','⬆️'],['стоп','✋'],['улица','🛣️'],['близко','📍'],['далеко','🗺️'],
 ['который час','🕔'],['часов','🕔'],['половин','🕧'],['утра','🌅'],['вечера','🌇'],['минута','⏱️'],
 ['пятница','🕌'],['суббота','📅'],['воскресенье','📅'],['понедельник','📅'],['день','☀️'],
 ['пожалуйста','🙏'],['счёт','🧾'],['без','🚫'],['сладкий','🍯'],['горячий','♨️'],['холодный','🧊'],
 ['можно','🙋'],['фото','📷'],['конечно','👍'],['к сожалению','😔'],['секундочку','☝️'],['помощь','🆘'],
 ['живу','🏙️'],['откуда','🌍'],['город','🏙️'],['деревня','🏘️'],['район','🗺️'],
 ['деньги','💵'],['нет денег','💸'],['сдача','🪙'],['плачу','💳'],['карта','💳'],['бесплатно','🎁'],
 ['почему','❓'],['потому','💬'],['опозда','⏰'],['автобус','🚌'],['занят','📵'],
 ['большой','🐘'],['маленький','🐭'],['новый','✨'],['старый','🏺'],['красивый','🌸'],['длинный','📏'],
 ['как красиво','🌅'],['вид','🏞️'],['море','🌊'],['небо','☁️'],['звёзды','✨'],['луна','🌙'],['машаллах','🤲'],
 ['моя книга','📕'],['твоя','🤝'],['его','👤'],['её','👤'],['это моё','🙋'],['чьё','❓'],['мой ключ','🔑'],
 ['голова','🤕'],['живот','🤢'],['болит','🤒'],['болен','🤒'],['здоровье','💪'],['лекарство','💊'],['выздоравливай','🌿'],
 ['дни','📅'],['неделя','🗓️'],['уже','⏳'],['два дня','✌️'],['таблетка','💊'],['каждый','🔁'],
 ['хочешь','🤝'],['люблю','❤️'],['отличн','🌟'],['возможно','🤔'],['другой раз','🗓️'],
 ['встреча','🤝'],['значит','💬'],['договорились','🤝'],['перед','📍'],['до','◀️'],['после','▶️'],
 ['алло','📞'],['кто говорит','📞'],['отвеча','📱'],['номер','🔢'],['ошибка','⚠️'],
 ['прости','🤝'],['я сделал','🙇'],['я забыл','🫣'],['ничего страшного','🕊️'],['сломал','💔'],['ты прав','⚖️'],
 ['был','⏪'],['была','⏪'],['вчера','🌒'],['верно','✅'],['давно','🏺']];
function emoji(v){ const k=(v.ru+' '+v.tr).toLowerCase();
  for(const [t,e] of EMO) if(k.includes(t)) return e; return '💬'; }

/* ================= HOME ================= */
function home(){
  stopSpeak();
  const doneN=Object.keys(done).length;
  $('#view').innerHTML=`
  <div class="home">
    <div class="apphead">
      <div class="logo">🫖</div>
      <div><h1>Ajeebus</h1><div class="sub">Level 2 · First Words · A1</div></div>
    </div>
    <div class="streak">
      <div class="f">🐐</div>
      <div><div class="t1">${doneN?`Streak safe — ${doneN} lesson${doneN>1?'s':''} done`:'Anza is eyeing your streak'}</div>
      <div class="t2">Miss a day and Anza eats it. Win it back with two lessons.</div></div>
    </div>
    ${AJ.seasons.map(se=>`
      <div class="season">
        <div class="seahead"><span class="n">Season ${se.n}</span><span class="t">${esc(se.title)}</span></div>
        <div class="lgrid">
          ${se.items.map(it=>{
            const n=it[0], has=!!prog(n), free=n<=3;
            return `<button class="lc ${done[n]?'done':''} ${has?'':'locked'}" data-open="${n}" ${has?'':'disabled'}>
              ${free?`<span class="freechip">FREE</span>`:(n<=30?`<span class="pay">🔒</span>`:'')}
              <span class="num">${n}</span><span class="lt">${esc(it[1])}</span>
            </button>`;}).join('')}
        </div>
      </div>`).join('')}
  </div>`;
  $('#view').onclick=e=>{const b=e.target.closest('[data-open]'); if(b) startFlow(+b.dataset.open);};
}

/* ================= FLOW ================= */
let F=null; /* {n, steps, idx, P, M, sub} */

function buildSteps(n){
  const P=prog(n), L=AJ.lessons.find(l=>l.n===n);
  const steps=[{t:'intro'}];
  const core=P.vocab.filter(v=>v.kind==='core'), seeds=P.vocab.filter(v=>v.kind!=='core');
  core.forEach((v,i)=>{
    steps.push({t:'word',v});
    if((i+1)%3===0||i===core.length-1){
      const pool=core.slice(0,i+1);
      if(pool.length>=2){
        const target=pool[Math.floor(Math.random()*pool.length)];
        const opts=[target,...pool.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
        steps.push({t:'check',target,opts});
      }
    }
  });
  if(seeds.length) steps.push({t:'seeds',seeds});
  steps.push({t:'theory'});
  P.drills.forEach(d=>steps.push({t:'ex',d}));
  steps.push({t:'episode',L});
  steps.push({t:'wrap'});
  return steps;
}

function startFlow(n){
  F={n,steps:buildSteps(n),idx:0,P:prog(n),M:flat.find(f=>f.n===n),sub:'none'};
  renderStep();
}
function next(){ if(F.idx<F.steps.length-1){F.idx++; renderStep();} }
function requeue(step){ F.steps.push({...step,retry:true}); }

function frame(inner,{cta='Continue',ctaOn=true,kicker='',q=''}={}){
  const pct=Math.round(F.idx/(F.steps.length-1)*100);
  $('#view').innerHTML=`
  <div class="flow">
    <div class="fhead">
      <button class="fx" id="fx">✕</button>
      <div class="fbar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="fbody">
      ${kicker?`<div class="kicker">${esc(kicker)}</div>`:''}
      ${q?`<div class="prompt-q">${esc(q)}</div>`:''}
      ${inner}
    </div>
    <div class="feedback" id="fb"><span class="fi"></span><div><div class="ft1"></div><div class="ft2"></div></div></div>
    <div class="ffoot"><button class="cta" id="cta" ${ctaOn?'':'disabled'}>${esc(cta)}</button></div>
  </div>`;
  $('#fx').onclick=()=>{ if(confirm('Leave the lesson? Progress in this session is kept.')) home(); };
}
function feedback(good,sub){
  const fb=$('#fb');
  fb.className='feedback '+(good?'good':'bad');
  fb.querySelector('.fi').textContent=good?'✓':'✕';
  fb.querySelector('.ft1').textContent=good?['Nice!','Correct!','ʿAjeeeb!','Exactly.'][Math.floor(Math.random()*4)]:'Not quite';
  fb.querySelector('.ft2').innerHTML=sub||'';
  $('#cta').disabled=false;
}

function renderStep(){
  const s=F.steps[F.idx], P=F.P, M=F.M;
  stopSpeak();

  /* ---------- intro ---------- */
  if(s.t==='intro'){
    frame(`<div class="intro">
      <div class="big">🫖</div>
      <h2>Lesson ${F.n} · ${esc(M.title)}</h2>
      <div class="goal">${esc(P.goal)}</div>
      <div class="meta"><span>≈ 7 min</span><span>${P.vocab.filter(v=>v.kind==='core').length} new words</span><span>1 rule</span></div>
    </div>`,{cta:'Start'});
    $('#cta').onclick=next; return;
  }

  /* ---------- word ---------- */
  if(s.t==='word'){
    const v=s.v;
    frame(`<div class="word">
      <div class="wimg">${emoji(v)}<span class="ph">illustration placeholder</span></div>
      <div class="war ar">${esc(v.ar)}</div>
      <div class="wtr">${esc(v.tr)}</div>
      <div class="wru">${esc(v.ru)}</div>
      <button class="spk" id="spk">🔊</button>
      <div class="ttsnote">tap to hear again</div>
    </div>`,{kicker:'New word'});
    const play=()=>{ const b=$('#spk'); b.classList.add('playing');
      const u=speak(v.ar,'ar-SA',0.75); if(u)u.onend=()=>b.classList.remove('playing');
      setTimeout(()=>b.classList.remove('playing'),2500); };
    setTimeout(play,250);           /* автопроизношение при появлении слова */
    $('#spk').onclick=play;
    $('#cta').onclick=next; return;
  }

  /* ---------- quick check ---------- */
  if(s.t==='check'){
    frame(`<div class="choices">${s.opts.map(o=>`<button class="choice ar" data-c="${esc(o.ar)}">${esc(o.ar)}</button>`).join('')}</div>`,
      {kicker:'Quick check',q:`Which one means “${s.target.ru}”?`,ctaOn:false,cta:'Continue'});
    let answered=false;
    $('.choices').onclick=e=>{
      const c=e.target.closest('[data-c]'); if(!c||answered) return; answered=true;
      const ok=c.dataset.c===s.target.ar;
      c.classList.add(ok?'good':'bad');
      if(!ok){ $$(`[data-c]`).find(x=>x.dataset.c===s.target.ar).classList.add('good'); requeue(s); }
      $$('.choice').forEach(x=>{if(x!==c)x.classList.add('ghost')});
      speak(s.target.ar,'ar-SA',0.8);
      feedback(ok, ok?'':`Correct: <span class="ar">${esc(s.target.ar)}</span> — ${esc(s.target.ru)}`);
    };
    $('#cta').onclick=next; return;
  }

  /* ---------- seeds ---------- */
  if(s.t==='seeds'){
    frame(`<div>${s.seeds.map((v,i)=>`
      <div class="seedrow" data-seed="${i}">
        <span class="sp">🔊</span>
        <div><div>${esc(v.ru)}</div><div class="sr">${esc(v.tr)}</div></div>
        <span class="sa ar">${esc(v.ar)}</span>
      </div>`).join('')}
      <div class="ttsnote" style="text-align:center;margin-top:6px">These appear in the episode — just recognize them, no need to memorize.</div>`,
      {kicker:'You will also hear',q:'Passive words — tap to listen'});
    $('.fbody').onclick=e=>{const r=e.target.closest('[data-seed]'); if(r) speak(s.seeds[+r.dataset.seed].ar,'ar-SA',0.75);};
    $('#cta').onclick=next; return;
  }

  /* ---------- theory ---------- */
  if(s.t==='theory'){
    const T=P.theory;
    frame(`<div class="theory">
      <button class="tvoice playing" id="tv">
        <span class="face">👳🏽‍♂️</span>
        <span><span class="t1">Ajeebus explains</span><br><span class="t2">audio auto-plays · system TTS placeholder</span></span>
        <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="pp" id="pp">❚❚</span>
      </button>
      <div class="tcard">
        <h3>${esc(T.title)}</h3>
        ${T.text.slice(0,2).map(t=>`<p>${esc(t)}</p>`).join('')}
        ${T.text.length>2?`<details><summary>One more detail</summary>${T.text.slice(2).map(t=>`<p>${esc(t)}</p>`).join('')}</details>`:''}
      </div>
    </div>`,{kicker:'Why it works'});
    let playing=true;
    const u=speak(T.voice,'ru-RU',0.95);            /* аудио теории стартует само */
    if(u) u.onend=()=>{ playing=false; $('#tv').classList.remove('playing'); $('#pp').textContent='▶'; };
    $('#tv').onclick=()=>{
      if(playing){ stopSpeak(); playing=false; $('#tv').classList.remove('playing'); $('#pp').textContent='▶'; }
      else{ const u2=speak(T.voice,'ru-RU',0.95); playing=true; $('#tv').classList.add('playing'); $('#pp').textContent='❚❚';
            if(u2)u2.onend=()=>{playing=false;$('#tv').classList.remove('playing');$('#pp').textContent='▶';} }
    };
    $('#cta').onclick=()=>{stopSpeak(); next();}; return;
  }

  /* ---------- exercises ---------- */
  if(s.t==='ex'){
    const d=s.d, type=d.type;

    if(type==='match'||(type==='recall'&&Array.isArray(d.items[0]))){
      const pairs=Array.isArray(d.items[0])?d.items:d.items.map(x=>[x,x]);
      const Lc=pairs.map((p,j)=>({t:p[0],j})).sort(()=>Math.random()-.5),
            Rc=pairs.map((p,j)=>({t:p[1],j})).sort(()=>Math.random()-.5);
      frame(`<div class="paircols">
        <div style="display:flex;flex-direction:column;gap:10px">${Lc.map(x=>`<button class="choice ar" data-ml="${x.j}">${esc(x.t)}</button>`).join('')}</div>
        <div style="display:flex;flex-direction:column;gap:10px">${Rc.map(x=>`<button class="choice" data-mr="${x.j}">${esc(x.t)}</button>`).join('')}</div>
      </div>`,{kicker:s.retry?'Try again':'Match the pairs',q:esc(d.task),ctaOn:false});
      let sl=null,sr=null,left=pairs.length;
      $('.fbody').onclick=e=>{
        const l=e.target.closest('[data-ml]'), r=e.target.closest('[data-mr]');
        if(l){ $$('[data-ml].sel').forEach(x=>x.classList.remove('sel')); l.classList.add('sel'); sl=l;
               speak(l.textContent,'ar-SA',0.85); }
        if(r){ $$('[data-mr].sel').forEach(x=>x.classList.remove('sel')); r.classList.add('sel'); sr=r; }
        if(sl&&sr){
          if(sl.dataset.ml===sr.dataset.mr){ sl.classList.add('good','ghost'); sr.classList.add('good','ghost');
            sl.classList.remove('sel'); sr.classList.remove('sel'); left--;
            if(!left){ feedback(true,''); $('#cta').onclick=next; } }
          else{ sl.classList.add('bad'); sr.classList.add('bad');
            setTimeout(()=>$$('.choice.bad').forEach(x=>x.classList.remove('bad','sel')),400); }
          sl=null; sr=null;
        }
      };
      $('#cta').onclick=next; return;
    }

    if(type==='build'){
      const it=d.items[0], words=[...it.words].sort(()=>Math.random()-.5);
      frame(`<div class="slots" id="slots"></div>
        <div class="bank">${words.map((w,i)=>`<button class="chipw" data-w="${i}">${esc(w)}</button>`).join('')}</div>`,
        {kicker:s.retry?'Try again':'Build the phrase',q:esc(d.task),ctaOn:false,cta:'Check'});
      const chosen=[];
      $('.fbody').onclick=e=>{
        const c=e.target.closest('.chipw'); if(!c) return;
        if(c.parentElement.id==='slots'){ c.remove();
          $(`.bank [data-w="${c.dataset.w}"]`)?.classList.remove('ghost');
          chosen.splice(chosen.findIndex(x=>x===c.dataset.w),1);
        } else if(!c.classList.contains('ghost')){
          const cl=c.cloneNode(true); $('#slots').appendChild(cl); c.classList.add('ghost'); chosen.push(c.dataset.w);
          speak(c.textContent,'ar-SA',0.9);
        }
        $('#cta').disabled = $('#slots').children.length!==words.length;
        $('#cta').textContent='Check';
        $('#cta').onclick=checkIt;
      };
      /* Пунктуация в target (؟ ! ،) не участвует в сборке — чипы её не несут. */
      const norm=x=>x.replace(/[؟!.,،]/g,'').replace(/\s+/g,' ').trim();
      const target=norm(it.target);
      function checkIt(){
        const cur=norm([...$('#slots').children].map(x=>x.textContent).join(' '));
        const ok=cur===target;
        if(!ok) requeue(s);
        speak(target,'ar-SA',0.8);
        feedback(ok, ok?'':`Correct: <span class="ar">${esc(it.target)}</span>`);
        $('#cta').textContent='Continue'; $('#cta').onclick=next;
      }
      $('#cta').onclick=checkIt; return;
    }

    if(type==='gap'){
      const it=d.items[0];
      if(!it.options){ /* свободный ввод — в прототипе показываем ответ */
        frame(`<div class="say"><div class="arb ar">${esc(it.text)}</div>
          <div class="mnote">${esc(it.hint||'')} — free typing in the real app</div></div>`,
          {kicker:'Fill the gap',q:esc(d.task),cta:'Got it'});
        $('#cta').onclick=next; return;
      }
      const opts=[...it.options].sort(()=>Math.random()-.5);
      frame(`<div class="say" style="margin:0 0 18px"><div class="arb ar">${esc(it.text)}</div></div>
        <div class="choices">${opts.map(o=>`<button class="choice ar" data-c="${esc(o)}">${esc(o)}</button>`).join('')}</div>`,
        {kicker:s.retry?'Try again':'Fill the gap',q:esc(d.task),ctaOn:false});
      let answered=false;
      $('.choices').onclick=e=>{
        const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
        const ok=c.dataset.c===it.answer;
        c.classList.add(ok?'good':'bad');
        if(!ok){ $$('[data-c]').find(x=>x.dataset.c===it.answer)?.classList.add('good'); requeue(s); }
        $$('.choice').forEach(x=>{if(x!==c)x.classList.add('ghost')});
        speak(it.text.replace('___',it.answer),'ar-SA',0.8);
        feedback(ok, ok?'':`Correct: <span class="ar">${esc(it.answer)}</span>`);
      };
      $('#cta').onclick=next; return;
    }

    if(type==='say'){
      const phrase=d.items[0];
      frame(`<div class="say">
        <div class="arb ar">${esc(phrase)}</div>
        <div class="mnote">Listen first, then hold the mic and repeat</div>
        <button class="mbtn" id="mic">🎙</button>
        <div class="mnote" id="mnote">speech check is a placeholder in this draft</div>
      </div>`,{kicker:'Say it out loud',q:esc(d.task),ctaOn:false});
      setTimeout(()=>speak(phrase,'ar-SA',0.7),300);
      $('#mic').onclick=()=>{ const m=$('#mic'); m.classList.add('rec'); $('#mnote').textContent='listening…';
        setTimeout(()=>{ m.classList.remove('rec'); $('#mnote').textContent='Sounded great — Ajeebus approves.';
          feedback(true,''); },1400); };
      $('#cta').onclick=next; return;
    }

    /* listen / plain recall: аудио → выбор */
    const correct=d.items[0], opts=[...d.items].sort(()=>Math.random()-.5);
    frame(`<button class="listenbtn" id="lb">🔊</button>
      <div class="choices">${opts.map(o=>`<button class="choice ar" data-c="${esc(o)}">${esc(o)}</button>`).join('')}</div>`,
      {kicker:s.retry?'Try again':'Listen and choose',q:esc(d.task),ctaOn:false});
    const playIt=()=>speak(correct,'ar-SA',0.75);
    setTimeout(playIt,300);
    $('#lb').onclick=playIt;
    let answered=false;
    $('.choices').onclick=e=>{
      const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
      const ok=c.dataset.c===correct;
      c.classList.add(ok?'good':'bad');
      if(!ok){ $$('[data-c]').find(x=>x.dataset.c===correct)?.classList.add('good'); requeue(s); }
      $$('.choice').forEach(x=>{if(x!==c)x.classList.add('ghost')});
      feedback(ok, ok?'':`It was: <span class="ar">${esc(correct)}</span>`);
    };
    $('#cta').onclick=next; return;
  }

  /* ---------- episode ---------- */
  if(s.t==='episode'){
    const L=s.L;
    const scenes=L?L.shots.filter(x=>x.ar.length).slice(0,3):[];
    frame(`<div class="vph"><div class="play">▶</div>
        <div class="cap">${L?`Episode ${F.n} · 12 shots${F.n<=3?' · footage shot ✓':''}`:`Episode ${F.n} — attached when the series catches up`}<br>Everything you just learned, in living Arabic.</div></div>
      <div class="subseg" id="sseg">
        <button data-sub="none" aria-pressed="true">No subtitles</button>
        <button data-sub="ar" aria-pressed="false">العربية</button>
        <button data-sub="ru" aria-pressed="false">AR + translation</button>
      </div>
      <div class="sublines" id="slines">
        ${scenes.map(x=>x.ar.map(a=>`<div class="subline"><div class="a ar">${esc(a)}</div><div class="r" data-ru style="display:none">${esc(x.ru.split('.')[0])}</div></div>`).join('')).join('')||'<div class="subline"><div class="r">Subtitle demo appears when the episode is attached.</div></div>'}
      </div>`,
      {kicker:'Episode',q:'Watch — you already know these words'});
    $('#sseg').onclick=e=>{const b=e.target.closest('[data-sub]'); if(!b)return;
      $$('#sseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#slines').classList.toggle('on',b.dataset.sub!=='none');
      $$('#slines [data-ru]').forEach(r=>r.style.display=b.dataset.sub==='ru'?'':'none');};
    $('#cta').onclick=next; return;
  }

  /* ---------- wrap ---------- */
  if(s.t==='wrap'){
    frame(`<div class="wrapend">
      <div class="trophy">🏆</div>
      <h2>Lesson ${F.n} complete!</h2>
      <div class="canlist">${P.wrap.map(w=>`<div class="cl">${esc(w)}</div>`).join('')}</div>
      <div class="phrase"><div class="p1">Phrase of the day</div><div class="p2">${esc(P.phrase)}</div></div>
    </div>`,{cta:'Finish'});
    $('#cta').onclick=()=>{ done[F.n]=true; store.save({done}); home(); window.scrollTo(0,0); };
    return;
  }
}

home();
</script>
</body>
</html>
