<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajeebus — app prototype v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ================= ТОКЕНЫ =================
     Тёмная тема по умолчанию: мир сериала — тёплый полумрак, чай, лампа.
     Светлая — тот же макет на слоновой кости. Цвета только переменными. */
  :root{
    --bg:#0E0B08; --bg2:#151009; --card:#1C1610; --card2:#241D15;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --ink:#F5EEE2; --dim:#B6A894; --faint:#7E7263;
    --gold:#D9A441; --gold-ink:#20180C; --gold-soft:rgba(217,164,65,.14);
    --em:#3BB795; --em-deep:#1B6E5B; --em-soft:rgba(59,183,149,.14);
    --clay:#E0603C; --clay-soft:rgba(224,96,60,.15);
    --scrim:linear-gradient(to top,rgba(10,8,6,.97) 10%,rgba(10,8,6,.86) 44%,rgba(10,8,6,.34) 100%);
    --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
    --r:20px;
  }
  :root[data-theme="light"]{
    --bg:#FAF5EC; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F6EFE2;
    --line:rgba(26,21,15,.10); --line2:rgba(26,21,15,.18);
    --ink:#1A150F; --dim:#6C6153; --faint:#9C9080;
    --gold:#A8760F; --gold-ink:#FFFFFF; --gold-soft:rgba(168,118,15,.12);
    --em:#12796A; --em-deep:#0C5A4E; --em-soft:rgba(18,121,106,.12);
    --clay:#B4432A; --clay-soft:rgba(180,67,42,.12);
    --scrim:linear-gradient(to top,rgba(20,15,10,.92) 4%,rgba(20,15,10,.55) 42%,rgba(20,15,10,0) 82%);
    --shadow:0 1px 3px rgba(60,45,20,.07),0 14px 34px rgba(60,45,20,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font:16px/1.5 'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:#080705;color:var(--ink);height:100dvh;overflow:hidden}
  :root[data-theme="light"] body{background:#EDE5D6}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}
  img{display:block;max-width:100%}
  .ar{font-family:'Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;line-height:1.75}
  .dsp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;letter-spacing:-.01em}
  .kick{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .muted{color:var(--dim)}

  .app{max-width:430px;margin:0 auto;height:100dvh;background:var(--bg);position:relative;
       display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .ribbon{background:#000;color:var(--dim);font-size:9.5px;padding:4px 12px;text-align:center;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;flex:none}
  .ribbon b{color:var(--gold)}
  #view{flex:1;display:flex;flex-direction:column;min-height:0}
  .scr{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .pad{padding:0 20px 30px}

  /* ---------- нижняя навигация ---------- */
  .nav{flex:none;display:flex;gap:4px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
       background:var(--bg2);border-top:1px solid var(--line)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;
              font-size:10px;font-weight:600;color:var(--faint);border-radius:14px;letter-spacing:.02em}
  .nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
  .nav button[aria-pressed="true"]{color:var(--gold)}

  /* ---------- шапки ---------- */
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
  .wordmark{font-size:23px;font-weight:600;letter-spacing:-.02em}
  .pill{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);
        background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
           display:grid;place-items:center;font-size:15px;color:var(--dim);flex:none}
  .head2{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;
         padding:14px 18px 12px;background:var(--bg);border-bottom:1px solid transparent}
  .scr.scrolled .head2{border-bottom-color:var(--line);backdrop-filter:blur(8px)}
  .back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
        color:var(--ink);border:1px solid var(--line);flex:none}
  .head2 .h2t{font-size:18px;font-weight:600}
  .head2 .h2s{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}

  /* ---------- герой курса ---------- */
  .hero{position:relative;margin:4px 20px 0;border-radius:24px;overflow:hidden;border:1px solid var(--line);
        box-shadow:var(--shadow);background:var(--card)}
  .hero img{width:100%;height:250px;object-fit:cover;object-position:center 35%;filter:brightness(.82)}
  .hero .veil{position:absolute;inset:0;background:var(--scrim)}
  .hero .txt{position:absolute;left:18px;right:18px;bottom:16px;color:#F7F1E6}
  .hero h2{font-size:29px;font-weight:600;margin:4px 0 8px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .hero .sub{font-size:12.5px;color:#D9CDBA;margin-bottom:12px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
  .barrow{display:flex;align-items:center;gap:10px}
  .barrow .n{font-size:11px;font-weight:700;color:#EADFCB;white-space:nowrap}

  .cta{width:100%;background:var(--em);color:#06231C;font-size:15.5px;font-weight:700;letter-spacing:.01em;
       padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
       position:relative;overflow:hidden;transition:transform .1s}
  :root[data-theme="light"] .cta{color:#fff}
  .cta:active{transform:scale(.985)}
  .cta:disabled{background:var(--card2);color:var(--faint)}
  .cta.auto::after{content:'';position:absolute;left:0;bottom:0;height:3px;background:rgba(0,0,0,.35);
                   width:100%;animation:cd 2s linear forwards}
  @keyframes cd{to{width:0}}
  .cta.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
  .ctawrap{padding:14px 20px 4px}

  /* ---------- строки курсов ---------- */
  .sect{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
        margin:26px 2px 12px}
  .crow{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:var(--card);
        border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:9px;transition:.12s}
  .crow:active{transform:scale(.99)}
  .crow img{width:58px;height:58px;border-radius:13px;object-fit:cover;flex:none}
  .crow .ph{width:58px;height:58px;border-radius:13px;flex:none;display:grid;place-items:center;
            background:var(--card2);font-size:22px;font-weight:700;color:var(--faint)}
  .crow .t{font-size:15px;font-weight:600}
  .crow .code{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;margin-left:7px}
  .crow .s{font-size:11.5px;color:var(--dim);margin-top:3px}
  .crow .mark{margin-left:auto;color:var(--faint);font-size:15px;flex:none}
  .crow.done{border-color:rgba(59,183,149,.35)}
  .crow.done .mark{color:var(--em)}
  .crow.locked img{filter:grayscale(.7) brightness(.55)}
  .crow.locked .t{color:var(--dim)}

  /* ---------- баннер серии ---------- */
  .epbanner{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
            border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:2px}
  .epbanner img{width:64px;height:48px;border-radius:11px;object-fit:cover;flex:none}
  .epbanner .t{font-size:13px;font-weight:600}
  .epbanner .s{font-size:11px;color:var(--dim);margin-top:2px}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.1em;
        color:var(--gold);text-transform:uppercase}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- стрик ---------- */
  .anza{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
        border-radius:18px;padding:12px 14px;margin-top:10px}
  .anza .em{font-size:24px}
  .anza .t{font-size:13px;font-weight:600}
  .anza .s{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.45}

  /* ================= САЛЯМ ================= */
  .salamwrap{position:relative;flex:1;display:flex;min-height:0}
  .salamwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .salamwrap .veil{position:absolute;inset:0;
    background:linear-gradient(to top,rgba(8,6,4,.97) 20%,rgba(8,6,4,.7) 55%,rgba(8,6,4,.45) 100%)}
  .stxt{position:relative;margin-top:auto;padding:0 24px calc(30px + env(safe-area-inset-bottom));width:100%;color:#F7F1E6}
  .stxt .big{font-size:44px;margin:8px 0 10px}
  .stxt p{font-size:14px;color:#CDBFA9;line-height:1.6;margin-bottom:22px;max-width:300px}
  .hint{text-align:center;font-size:10.5px;color:#8B8071;margin-top:10px}

  /* ================= ОБЩЕЕ ================= */
  .foot{text-align:center;font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:22px}
  .lead{font-size:13.5px;color:var(--dim);line-height:1.65;margin-bottom:16px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
        font-size:12.5px;line-height:1.55;color:var(--dim);margin-bottom:12px}
  .note.gold{background:var(--gold-soft);border-color:rgba(217,164,65,.3);color:var(--ink)}
  .note b{color:var(--ink)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chips span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
  .cover{position:relative;border-radius:20px;overflow:hidden;margin:2px 0 14px;border:1px solid var(--line)}
  .cover img{width:100%;height:170px;object-fit:cover;object-position:center 40%;filter:brightness(.72)}
  .cover .veil{position:absolute;inset:0;background:var(--scrim)}
  .covtxt{position:absolute;left:16px;right:16px;bottom:14px;font-size:13.5px;line-height:1.55;color:#F0E7D8}
  .prow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:12px 14px;margin-bottom:9px}
  .prow .pnum{width:28px;height:28px;border-radius:9px;background:var(--card2);color:var(--dim);flex:none;
              display:grid;place-items:center;font-size:12.5px;font-weight:700}
  .prow.dn .pnum{background:var(--em-soft);color:var(--em)}
  .prow .pt{font-size:13.5px;font-weight:600}
  .prow .pr{font-size:10px;color:var(--faint);font-weight:600;margin-left:7px}
  .prow .pdsc{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
  .reset{display:block;margin:20px auto 0;font-size:10.5px;color:var(--faint);text-decoration:underline}

  /* ================= ПУТЬ ================= */
  .pathwrap{padding:0 20px 30px}
  .unlockbar{display:block;width:calc(100% - 40px);margin:2px 20px 6px;background:var(--gold-soft);
             border:1px dashed rgba(217,164,65,.45);color:var(--gold);font-size:11.5px;font-weight:600;
             border-radius:14px;padding:10px 12px;text-align:left}
  .chapter{position:relative;border-radius:20px;overflow:hidden;margin:18px 0 4px;border:1px solid var(--line)}
  .chapter img{width:100%;height:168px;object-fit:cover;object-position:center 45%;filter:brightness(.72) saturate(.95)}
  .chapter .veil{position:absolute;inset:0;background:var(--scrim)}
  .chtxt{position:absolute;left:16px;right:16px;bottom:14px;color:#F7F0E4;
       text-shadow:0 1px 12px rgba(0,0,0,.75)}
  .chtxt h3{font-size:23px;font-weight:600;margin:3px 0 6px}
  .chtxt p{font-size:11.5px;color:#D2C5B2;line-height:1.5;margin-bottom:10px}
  .nodes{position:relative;padding:14px 0 6px}
  .nodes::before{content:'';position:absolute;left:50%;top:0;bottom:14px;
                 border-left:2px dashed var(--line2);transform:translateX(-1px)}
  .noderow{position:relative;z-index:1;width:max-content;max-width:190px;margin:9px auto;
           display:flex;flex-direction:column;align-items:center}
  .node{width:64px;height:64px;border-radius:50%;background:var(--card);border:1.5px solid var(--line2);
        display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink);position:relative;
        box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .12s}
  .node:active{transform:scale(.94)}
  .node .lockdot{position:absolute;top:-2px;right:-4px;font-size:13px}
  .node.is-done{background:var(--em);border-color:var(--em);color:#06231C;font-size:25px}
  :root[data-theme="light"] .node.is-done{color:#fff}
  .node.is-cur{width:82px;height:82px;font-size:24px;color:var(--gold);border:2px solid var(--gold);
               background:var(--card2);box-shadow:0 0 0 6px var(--gold-soft),0 10px 28px rgba(0,0,0,.4)}
  .node.is-lock{opacity:.62}
  .node.is-soon{opacity:.3;box-shadow:none}
  .startchip{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);
             color:var(--gold-ink);border-radius:99px;padding:3px 11px;margin-bottom:8px}
  .nlabel{margin-top:9px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.35;max-width:170px}
  .node.is-cur+.nlabel{color:var(--gold);font-weight:600}

  /* ================= СЕРИАЛ ================= */
  .eprow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
         border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px}
  .eprow.soon{opacity:.5}
  .eprow .thumb{position:relative;width:76px;height:56px;border-radius:11px;overflow:hidden;flex:none}
  .eprow .thumb img{width:100%;height:100%;object-fit:cover}
  .eprow .play{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#fff;
               background:rgba(0,0,0,.35)}
  .eprow .t{font-size:13px;font-weight:600}
  .eprow .s{font-size:11px;color:var(--dim);margin-top:2px}
  .eprow .mark{margin-left:auto;font-size:14px}

  /* ================= ПРОФИЛЬ ================= */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
  .stat b{display:block;font-size:24px;font-weight:600}
  .stat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}

  /* ================= ПЕЙВОЛЛ ================= */
  .pwscr{background:var(--bg)}
  .pwhero{position:relative}
  .pwhero img{width:100%;height:260px;object-fit:cover;object-position:center 40%}
  .pwhero .veil{position:absolute;inset:0;background:var(--scrim)}
  .pwx{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;
       background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:15px}
  .pwtxt{position:absolute;left:20px;right:20px;bottom:16px;color:#F7F1E6}
  .pwtxt h2{font-size:26px;font-weight:600;line-height:1.25;margin-top:6px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .bens{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .bens .b{display:flex;gap:10px;font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:9px}
  .bens .b:last-child{margin-bottom:0}
  .bens .b::before{content:'✓';color:var(--em);font-weight:800}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .plan{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:18px;
        padding:16px 10px 13px;text-align:center;display:flex;flex-direction:column;gap:3px}
  .plan b{font-size:16px;font-weight:600}
  .plan span{font-size:11.5px;color:var(--ink)}
  .plan em{font-size:10px;color:var(--faint);font-style:normal}
  .plan.sel{border-color:var(--gold);background:var(--gold-soft)}
  .plan .badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);
               color:var(--gold-ink);font-size:8.5px;font-weight:800;letter-spacing:.08em;
               border-radius:99px;padding:3px 9px;text-transform:uppercase}
  .pwnote{text-align:center;font-size:9.5px;color:var(--faint);margin-top:12px}
  .pwfoot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
          background:var(--bg2)}
  .later{width:100%;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:11px 0 2px}

  /* ================= УРОК ================= */
  .flow{flex:1;display:flex;flex-direction:column;min-height:0}
  .fhead{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;flex:none}
  .fx{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;
      font-size:16px;color:var(--dim);flex:none}
  .fbar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
  .fbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.3,1)}
  .fbody{flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;min-height:0}
  .ffoot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
         background:var(--bg2)}
  .fb{display:none;align-items:flex-start;gap:11px;padding:13px 20px;margin:0}
  .fb.good{display:flex;background:var(--em-soft);color:var(--em)}
  .fb.bad{display:flex;background:var(--clay-soft);color:var(--clay)}
  .fb .fi{font-size:19px;line-height:1.1}
  .fb .f1{font-weight:700;font-size:14px}
  .fb .f2{font-size:12.5px;margin-top:2px;color:var(--dim)}
  .fb .f2 .ar{font-size:16px;color:var(--ink)}
  .qkick{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  .q{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:14px}

  /* интро урока */
  .lintro{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
  .lintro .cardimg{width:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);position:relative}
  .lintro .cardimg img{width:100%;height:200px;object-fit:cover}
  .lintro .cardimg .veil{position:absolute;inset:0;background:var(--scrim)}
  .lintro h2{font-size:25px;font-weight:600}
  .lintro .goal{font-size:13.5px;color:var(--dim);line-height:1.6;max-width:310px}
  .lintro .meta{display:flex;gap:7px}
  .lintro .meta span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:5px 11px}

  /* слово */
  .wordwrap{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .wpic{width:190px;height:190px;border-radius:50%;overflow:hidden;position:relative;border:1px solid var(--line);
        display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 22%,var(--card2),var(--card));
        box-shadow:var(--shadow);margin-bottom:20px;font-size:76px}
  .wpic img{width:100%;height:100%;object-fit:cover;opacity:.9}
  .wpic .em{position:relative;z-index:1;text-shadow:0 8px 26px rgba(0,0,0,.55)}
  .wpic.photo{background:none}
  .war{font-size:50px;color:var(--ink);line-height:1.5}
  .wgloss{font-size:17px;color:var(--dim);margin-top:2px}

const AR_RE=/[؀-ۿ]/;
function gloss(ru){ if(!ru) return ''; if(AR_RE.test(ru)) return ru; return EN_GLOSS[ru]||ru; }

/* ---------- фраза-пример для карточки слова: ищем в материале урока фразу ≥2 слов с этим словом ---------- */
const stripAr=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[؟!.,،:؛]/g,'').replace(/\s+/g,' ').trim();
function phraseFor(v,P){
  const w=stripAr(v.ar); if(!w) return null;
  const cand=[];
  for(const d of P.drills||[]){
    if(d.type==='build') for(const it of d.items) cand.push(it.target);
    if(d.type==='say') for(const it of d.items) if(typeof it==='string') cand.push(it);
    if(d.type==='gap') for(const it of d.items) if(it.text&&it.answer) cand.push(it.text.replace('___',it.answer));
  }
  for(const v2 of P.vocab||[]) if(v2!==v) cand.push(v2.ar);
  for(const c of cand){
    const sc=stripAr(c);
    if(sc!==w && sc.split(' ').length>=2 && (' '+sc+' ').includes(' '+w+' ')) return c;
  }
  return null;
}

       <div class="pad">
         <p class="lead">${mode==='peak'
           ?'You asked, you thanked, you got your tea. Ajeebus says it would be a shame to stop here.'
           :'Lessons 4–50 continue the story — and the story is what makes the words stick.'}</p>
         <div class="bens">
           <div class="b">All 50 lessons of Course 2 — and Courses 3–6 as they arrive</div>
           <div class="b">A new episode of the series with every lesson</div>
           <div class="b">Ajeebus's voice on every word, every rule, every push</div>
           <div class="b">Streak repair — win it back from Anza with two lessons</div>
         </div>
         <div class="plans">
           <button class="plan ${plan==='year'?'sel':''}" data-plan="year"><span class="badge">save 58%</span>
             <b class="dsp">Yearly</b><span>$39.99 / year</span><em>$3.33 per month</em></button>
           <button class="plan ${plan==='month'?'sel':''}" data-plan="month">
             <b class="dsp">Monthly</b><span>$7.99 / month</span><em>cancel anytime</em></button>
         </div>
         <div class="pwnote">draft — prices are placeholders</div>
       </div>
     </div>
     <div class="pwfoot">
       <button class="cta" id="buy">Continue with Ajeebus</button>
       <button class="later" data-later>Maybe later</button>
     </div>`;
    $('#view').onclick=e=>{
      const p=e.target.closest('[data-plan]'); if(p){plan=p.dataset.plan; render(); return;}
      if(e.target.closest('[data-later]')){ $('#view').onclick=null; return course2(); }
      if(e.target.closest('#buy')){ $('#view').onclick=null; S.sub=true; persist(); course2(); }
    };
  };
  render();
}

function exitFlow(){ if(F){clearTimeout(F.timer);} stopSpeak(); F=null; course2(); }
function finishLesson(){ done[F.n]=true; S.done=done; persist(); const n=F.n; F=null;
  if(n===3&&!S.sub) paywall('peak'); else course2(); }

/* ================= УРОК (v6) ================= */
let F=null;
function buildSteps(n){
  const P=prog(n), L=AJ.lessons.find(l=>l.n===n);
  const steps=[{t:'intro'}];
  const core=P.vocab.filter(v=>v.kind==='core'), seeds=P.vocab.filter(v=>v.kind!=='core');
  core.forEach((v,i)=>{
    steps.push({t:'word',v});
    if((i+1)%3===0||i===core.length-1){
      const pool=core.slice(0,i+1);
      if(pool.length>=2){
        const target=pool[Math.floor(Math.random()*pool.length)];
        const opts=[target,...pool.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
        steps.push({t:'check',target,opts});
      }
    }
  });
  if(seeds.length) steps.push({t:'seeds',seeds});
  steps.push({t:'theory'});
  P.drills.forEach(d=>steps.push({t:'ex',d}));
  steps.push({t:'episode',L});
  steps.push({t:'wrap'});
  return steps;
}
function startFlow(n,jump){
  F={n,steps:buildSteps(n),idx:0,P:prog(n),M:flat.find(f=>f.n===n),timer:0,pct:0};
  if(jump==='episode'){const i=F.steps.findIndex(s=>s.t==='episode'); if(i>0)F.idx=i;}
  renderStep();
}
function next(){ if(!F) return; clearTimeout(F.timer);
  if(F.idx<F.steps.length-1){F.idx++; renderStep();} }
function requeue(s){ F.steps.push({...s,retry:true}); }
function autoNext(ms){ clearTimeout(F.timer);
  const c=$('#cta'); if(c&&(ms||2000)>=1800){c.classList.remove('auto'); void c.offsetWidth; c.classList.add('auto');}
  F.timer=setTimeout(next,ms||2000); }

function frame(inner,{cta='Continue',ctaOn=true,kicker='',q=''}={}){
  const raw=Math.round(F.idx/Math.max(1,F.steps.length-1)*100);
  F.pct=Math.max(F.pct||0,raw);
  $('#view').onclick=null;
  $('#view').innerHTML=`<div class="flow">
    <div class="fhead"><button class="fx" id="fx">✕</button>
      <div class="fbar"><i style="width:${F.pct}%"></i></div></div>
    <div class="fbody">
      ${kicker?`<div class="qkick">${esc(kicker)}</div>`:''}
      ${q?`<div class="q">${esc(q)}</div>`:''}
      ${inner}
    </div>
    <div class="fb" id="fb"><span class="fi"></span><div><div class="f1"></div><div class="f2"></div></div></div>
    <div class="ffoot"><button class="cta" id="cta" ${ctaOn?'':'disabled'}>${esc(cta)}</button></div>
  </div>`;
  $('#fx').onclick=exitFlow;
}
function feedback(good,sub){
  const fb=$('#fb'); fb.className='fb '+(good?'good':'bad');
  fb.querySelector('.fi').textContent=good?'✓':'✕';
  fb.querySelector('.f1').textContent=good?['Nice.','Correct.','ʿAjeeb!','Exactly.'][Math.floor(Math.random()*4)]:'Not quite';
  fb.querySelector('.f2').innerHTML=sub||'';
  $('#cta').disabled=false;
}

function renderStep(){
  const s=F.steps[F.idx], P=F.P;
  clearTimeout(F.timer); stopSpeak();

  if(s.t==='intro'){
    frame(`<div class="lintro">
      <div class="cardimg"><img src="${lessonImg(F.n)}" alt=""><div class="veil"></div></div>
      <h2 class="dsp">Lesson ${F.n} · ${esc(lTitle(F.n))}</h2>
      <div class="goal">${esc(P.goal)}</div>
      <div class="meta"><span>≈ 7 min</span><span>${P.vocab.filter(v=>v.kind==='core').length} new words</span><span>1 rule</span></div>
    </div>`,{cta:'Start'});
    $('#cta').onclick=next; return;
  }

  if(s.t==='word'){
    const v=s.v, ph=phraseFor(v,P);
    frame(`<div class="wordwrap">
      <div class="wpic"><span class="em">${emoji(v)}</span></div>
      <div class="war ar">${esc(v.ar)}</div>
      <div class="wgloss">${esc(gloss(v.ru))}</div>
      <button class="wspk" id="spk"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16 9.4a4 4 0 0 1 0 5.2"/><path d="M18.6 7a7.5 7.5 0 0 1 0 10"/></svg></button>
      ${ph?`<button class="phrasechip" id="phc"><span class="ar">${esc(ph)}</span>
        <span class="cap">hear it inside a phrase</span></button>`:''}
    </div>`,{kicker:'New word'});
    const play=()=>{const b=$('#spk'); b.classList.add('playing');
      const u=speak(v.ar,'ar-SA',0.75); if(u)u.onend=()=>b.classList.remove('playing');
      setTimeout(()=>b.classList.remove('playing'),2500);};
    setTimeout(play,250); $('#spk').onclick=play;
    if(ph) $('#phc').onclick=()=>speak(ph,'ar-SA',0.75);
    $('#cta').onclick=next; return;
  }

  if(s.t==='check'){
    frame(`<div class="wpic" style="margin:6px auto 0;width:140px;height:140px;font-size:56px"><span class="em">${emoji(s.target)}</span></div>
      <div class="opts">${s.opts.map(o=>`<button class="opt ar" data-c="${esc(o.ar)}">${esc(o.ar)}</button>`).join('')}</div>`,
      {kicker:'Quick check',q:`Which one means “${short(s.target.ru)}”?`,ctaOn:false});
    let answered=false;
    $('.opts').onclick=e=>{
      const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
      const ok=c.dataset.c===s.target.ar;
      c.classList.add(ok?'good':'bad');
      if(!ok){$$('[data-c]').find(x=>x.dataset.c===s.target.ar).classList.add('good'); requeue(s);}
      $$('.opt').forEach(x=>{if(x!==c)x.classList.add('ghost')});
      speak(s.target.ar,'ar-SA',0.8);
      feedback(ok, ok?'':`Correct: <span class="ar">${esc(s.target.ar)}</span> — ${esc(gloss(s.target.ru))}`);
      if(ok) autoNext(2000);
    };
    $('#cta').onclick=next; return;
  }

  if(s.t==='seeds'){
    frame(`<div style="margin:auto 0">${s.seeds.map((v,i)=>`
       <button class="opt" data-seed="${i}" style="justify-content:space-between;gap:12px;margin-bottom:9px">
         <span style="font-size:13.5px;color:var(--dim)">🔊 ${esc(gloss(v.ru))}</span>
         <span class="ar" style="font-size:21px">${esc(v.ar)}</span></button>`).join('')}
       <div class="mnote" style="text-align:center;margin-top:8px">You will hear these in the episode — recognize them, no need to memorize.</div></div>`,
      {kicker:'Passive words',q:'Tap to listen'});
    $('.fbody').onclick=e=>{const r=e.target.closest('[data-seed]'); if(r) speak(s.seeds[+r.dataset.seed].ar,'ar-SA',0.75);};
    $('#cta').onclick=next; return;
  }

  if(s.t==='theory'){
    const T=P.theory;
    frame(`<div class="theory">
      <button class="tvoice playing" id="tv">
        <img src="${IMG.ajeebus}" alt="">
        <span><span class="t1">Ajeebus explains it his way</span><br>
        <span class="t2">plays automatically · system voice placeholder</span></span>
        <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <div class="tcard">
        <h3 class="dsp">${esc(T.title)}</h3>
        ${T.text.slice(0,2).map(t=>`<p>${esc(t)}</p>`).join('')}
        ${T.text.length>2?`<details><summary>one more detail</summary>${T.text.slice(2).map(t=>`<p>${esc(t)}</p>`).join('')}</details>`:''}
      </div></div>`,{kicker:'Why it works'});
    let playing=true;
    const u=speak(T.voice,'ru-RU',0.95);
    if(u)u.onend=()=>{playing=false;$('#tv').classList.remove('playing');};
    $('#tv').onclick=()=>{ if(playing){stopSpeak();playing=false;$('#tv').classList.remove('playing');}
      else{const u2=speak(T.voice,'ru-RU',0.95);playing=true;$('#tv').classList.add('playing');
        if(u2)u2.onend=()=>{playing=false;$('#tv').classList.remove('playing');}} };
    $('#cta').onclick=()=>{stopSpeak(); next();}; return;
  }

  if(s.t==='ex'){
    const d=s.d, type=d.type;

    if(type==='match'||(type==='recall'&&Array.isArray(d.items[0]))){
      const pairs=Array.isArray(d.items[0])?d.items:d.items.map(x=>[x,x]);
      const L=pairs.map((p,j)=>({t:p[0],j})).sort(()=>Math.random()-.5),
            R=pairs.map((p,j)=>({t:gloss(p[1]),j})).sort(()=>Math.random()-.5);
      frame(`<div class="pairs">
        <div class="col">${L.map(x=>`<button class="opt ar" data-ml="${x.j}">${esc(x.t)}</button>`).join('')}</div>
        <div class="col">${R.map(x=>`<button class="opt" data-mr="${x.j}">${esc(x.t)}</button>`).join('')}</div>
      </div>`,{kicker:s.retry?'Try again':'Match',q:'Match Arabic to its meaning',ctaOn:false});
      let sl=null,sr=null,left=pairs.length;
      $('.fbody').onclick=e=>{
        const l=e.target.closest('[data-ml]'), r=e.target.closest('[data-mr]');
        if(l){$$('[data-ml].sel').forEach(x=>x.classList.remove('sel')); l.classList.add('sel'); sl=l; speak(l.textContent,'ar-SA',0.85);}
        if(r){$$('[data-mr].sel').forEach(x=>x.classList.remove('sel')); r.classList.add('sel'); sr=r;}
        if(sl&&sr){
          if(sl.dataset.ml===sr.dataset.mr){ [sl,sr].forEach(x=>{x.classList.add('good','ghost');x.classList.remove('sel')}); left--;
            if(!left){feedback(true,''); autoNext(1400);} }
          else{ [sl,sr].forEach(x=>x.classList.add('bad'));
            setTimeout(()=>$$('.opt.bad').forEach(x=>x.classList.remove('bad','sel')),400); }
          sl=null; sr=null;
        }
      };
      $('#cta').onclick=next; return;
    }

    if(type==='build'){
      const it=d.items[0], words=[...it.words].sort(()=>Math.random()-.5);
      frame(`<button class="listen" id="lb"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16 9.4a4 4 0 0 1 0 5.2"/><path d="M18.6 7a7.5 7.5 0 0 1 0 10"/></svg></button>
        <div class="slots" id="slots"></div>
        <div class="bank">${words.map((w,i)=>`<button class="chipw" data-w="${i}">${esc(w)}</button>`).join('')}</div>`,
        {kicker:s.retry?'Try again':'Build',q:'Build the phrase you hear',ctaOn:false,cta:'Check'});
      const playT=()=>speak(it.target,'ar-SA',0.72);
      setTimeout(playT,300); $('#lb').onclick=playT;
      $('.fbody').onclick=e=>{
        const c=e.target.closest('.chipw'); if(!c)return;
        if(c.parentElement.id==='slots'){c.remove(); $(`.bank [data-w="${c.dataset.w}"]`)?.classList.remove('ghost');}
        else if(!c.classList.contains('ghost')){const cl=c.cloneNode(true); $('#slots').appendChild(cl);
          c.classList.add('ghost'); speak(c.textContent,'ar-SA',0.9);}
        $('#cta').disabled=$('#slots').children.length!==words.length;
        $('#cta').textContent='Check'; $('#cta').onclick=checkIt;
      };
      const norm=x=>x.replace(/[؟!.,،]/g,'').replace(/\s+/g,' ').trim();
      const target=norm(it.target);
      function checkIt(){
        const cur=norm([...$('#slots').children].map(x=>x.textContent).join(' '));
        const ok=cur===target; if(!ok) requeue(s);
        speak(target,'ar-SA',0.8);
        feedback(ok, ok?'':`Correct: <span class="ar">${esc(it.target)}</span>`);
        $('#cta').textContent='Continue'; $('#cta').onclick=next;
        if(ok) autoNext(2000);
      }
      $('#cta').onclick=checkIt; return;
    }

    if(type==='gap'){
      const it=d.items[0];
      if(!it.options){
        frame(`<div class="say"><div class="arb ar">${esc(it.text)}</div>
          <div class="mnote">free typing in the real app</div></div>`,
          {kicker:'Fill the gap',q:'Say the missing word, then continue',cta:'Got it'});
        $('#cta').onclick=next; return;
      }
      const opts=[...it.options].sort(()=>Math.random()-.5);
      frame(`<div class="say" style="margin:0 0 10px"><div class="arb ar">${esc(it.text)}</div></div>
        <div class="opts">${opts.map(o=>`<button class="opt ar" data-c="${esc(o)}">${esc(o)}</button>`).join('')}</div>`,
        {kicker:s.retry?'Try again':'Fill the gap',q:'Choose the missing word',ctaOn:false});
      let answered=false;
      $('.opts').onclick=e=>{
        const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
        const ok=c.dataset.c===it.answer;
        c.classList.add(ok?'good':'bad');
        if(!ok){$$('[data-c]').find(x=>x.dataset.c===it.answer)?.classList.add('good'); requeue(s);}
        $$('.opt').forEach(x=>{if(x!==c)x.classList.add('ghost')});
        speak(it.text.replace('___',it.answer),'ar-SA',0.8);
        feedback(ok, ok?'':`Correct: <span class="ar">${esc(it.answer)}</span>`);
        if(ok) autoNext(2000);
      };
      $('#cta').onclick=next; return;
    }

    if(type==='say'){
      const phrase=d.items[0];
      frame(`<div class="say">
        <div class="arb ar">${esc(phrase)}</div>
        <div class="mnote">listen first, then hold and repeat</div>
        <button class="mic" id="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></button>
        <div class="mnote" id="mnote">speech check is a placeholder in this draft</div>
      </div>`,{kicker:'Speak',q:'Say it out loud',ctaOn:false});
      setTimeout(()=>speak(phrase,'ar-SA',0.7),300);
      $('#mic').onclick=()=>{const m=$('#mic'); m.classList.add('rec'); $('#mnote').textContent='listening…';
        setTimeout(()=>{m.classList.remove('rec'); $('#mnote').textContent='Sounded good — Ajeebus approves.';
          feedback(true,''); autoNext(1800);},1400);};
      $('#cta').onclick=next; return;
    }

    const correct=d.items[0], opts=[...d.items].sort(()=>Math.random()-.5);
    frame(`<button class="listen" id="lb"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16 9.4a4 4 0 0 1 0 5.2"/><path d="M18.6 7a7.5 7.5 0 0 1 0 10"/></svg></button>
      <div class="opts">${opts.map(o=>`<button class="opt ar" data-c="${esc(o)}">${esc(o)}</button>`).join('')}</div>`,
      {kicker:s.retry?'Try again':'Listen',q:'Tap what you hear',ctaOn:false});
    const playIt=()=>speak(correct,'ar-SA',0.75);
    setTimeout(playIt,300); $('#lb').onclick=playIt;
    let answered=false;
    $('.opts').onclick=e=>{
      const c=e.target.closest('[data-c]'); if(!c||answered)return; answered=true;
      const ok=c.dataset.c===correct;
      c.classList.add(ok?'good':'bad');
      if(!ok){$$('[data-c]').find(x=>x.dataset.c===correct)?.classList.add('good'); requeue(s);}
      $$('.opt').forEach(x=>{if(x!==c)x.classList.add('ghost')});
      feedback(ok, ok?'':`It was: <span class="ar">${esc(correct)}</span>`);
      if(ok) autoNext(2000);
    };
    $('#cta').onclick=next; return;
  }

  if(s.t==='episode'){
    const L=s.L, scenes=L?L.shots.filter(x=>x.ar.length).slice(0,3):[];
    frame(`<div class="vplayer"><img src="${lessonImg(F.n)}" alt="">
        <div class="play"><span>▶</span></div>
        <div class="cap">${L?`Episode ${F.n} · 12 shots${F.n<=3?' · footage ready':''}`:`Episode ${F.n} — attached when the series catches up`}</div></div>
      <div class="subseg" id="sseg">
        <button data-sub="none" aria-pressed="true">No subtitles</button>
        <button data-sub="ar" aria-pressed="false">العربية</button>
        <button data-sub="ru" aria-pressed="false">AR + translation</button>
      </div>
      <div class="sublines" id="slines">
        ${scenes.map(x=>x.ar.map(a=>`<div class="subline"><div class="a ar">${esc(a)}</div>
          <div class="r" data-ru style="display:none">${esc(x.ru.split('.')[0])}</div></div>`).join('')).join('')
          ||'<div class="subline"><div class="r">Subtitles appear when the episode is attached.</div></div>'}
      </div>`,{kicker:'Episode',q:'Watch — you already know these words'});
    $('#sseg').onclick=e=>{const b=e.target.closest('[data-sub]'); if(!b)return;
      $$('#sseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#slines').classList.toggle('on',b.dataset.sub!=='none');
      $$('#slines [data-ru]').forEach(r=>r.style.display=b.dataset.sub==='ru'?'':'none');};
    $('#cta').onclick=next; return;
  }

  if(s.t==='wrap'){
    frame(`<div class="wrapend">
      <div class="medal">🏅</div>
      <h2 class="dsp">Lesson ${F.n} complete</h2>
      <div class="canlist">${P.wrap.map(w=>`<div class="cl">${esc(w)}</div>`).join('')}</div>
      <div class="today"><div class="p1">Phrase of the day</div><div class="p2">${esc(P.phrase)}</div></div>
    </div>`,{cta:'Finish'});
    $('#cta').onclick=finishLesson; return;
  }
}

function boot(){ let seen=false; try{seen=!!sessionStorage.getItem('aj_salam')}catch(e){}
  if(seen) home(); else salam(); }
boot();
</script>
