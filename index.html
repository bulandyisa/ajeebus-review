<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аджибус · Приёмка материалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13110D; --panel:#1C1915; --panel-2:#242019; --line:#332D23;
    --ink:#F2EADB; --dim:#9C907A; --emerald:#22A98D; --saffron:#EBA83A;
    --clay:#D2603C; --ok:#3FB871; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:18px 20px 40px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
  input,textarea,select{font-family:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;width:100%}
  textarea{resize:vertical;min-height:48px;line-height:1.45}

  header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-family:'Unbounded',sans-serif;font-weight:800;font-size:19px}
  .brand span{color:var(--emerald)}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
  .stats{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 12px;min-width:74px}
  .stat b{display:block;font-family:'Unbounded',sans-serif;font-size:16px;line-height:1.2}
  .stat i{font-style:normal;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--clay)} .stat.canon b{color:var(--saffron)}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{background:var(--panel-2);border-color:#4A4132}
  .btn.primary{background:var(--emerald);border-color:var(--emerald);color:#08221C;font-weight:700}
  .btn.primary:hover{background:#2BC0A1}
  .btn.gold{background:var(--saffron);border-color:var(--saffron);color:#2E1E02;font-weight:700}
  .btn.gold:hover{background:#F5B94F}
  .btn.ghost{color:var(--dim)}
  .btn:disabled{opacity:.4;cursor:default}
  .seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .seg button{padding:6px 11px;border-radius:7px;font-size:12.5px;color:var(--dim);font-weight:500;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
  .search{max-width:200px}
  .spacer{flex:1}

  .folder{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:14px;font-size:13px;flex-wrap:wrap}
  .folder b{color:var(--emerald);font-weight:600}
  .folder .path{color:var(--dim);font-size:12.5px}
  .folder.warn{border-color:rgba(235,168,58,.5);background:rgba(235,168,58,.07)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:#4A4132}
  .card.s-accepted{border-color:rgba(63,184,113,.55)}
  .card.s-rejected{opacity:.45}
  .card.s-canon{border-color:var(--saffron);box-shadow:0 0 0 1px rgba(235,168,58,.35)}
  .thumb{position:relative;aspect-ratio:3/4;background:#0D0B08;display:grid;place-items:center;cursor:zoom-in;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.68)}
  .badge.vid{color:var(--saffron)} .badge.img{color:var(--emerald)}
  .mark{position:absolute;top:6px;right:6px;width:23px;height:23px;border-radius:50%;display:none;place-items:center;font-size:12px;font-weight:700}
  .card.s-accepted .mark{display:grid;background:var(--ok);color:#062514}
  .card.s-rejected .mark{display:grid;background:var(--clay);color:#2A0D05}
  .card.s-canon .mark{display:grid;background:var(--saffron);color:#2E1E02}
  .body{padding:10px 11px;display:flex;flex-direction:column;gap:7px;flex:1}
  .name{font-size:12.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .meta{font-size:10.5px;color:var(--dim);display:flex;gap:7px;flex-wrap:wrap}
  .actions{display:flex;gap:5px;margin-top:auto}
  .act{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 4px;font-size:14px;line-height:1;transition:.12s;background:var(--panel-2)}
  .act:hover{transform:translateY(-1px)}
  .act.a:hover,.act[aria-pressed="true"].a{border-color:var(--ok);color:var(--ok)}
  .act.r:hover,.act[aria-pressed="true"].r{border-color:var(--clay);color:var(--clay)}
  .act.c:hover,.act[aria-pressed="true"].c{border-color:var(--saffron);color:var(--saffron)}
  .act[aria-pressed="true"].a{background:rgba(63,184,113,.12)}
  .act[aria-pressed="true"].r{background:rgba(210,96,60,.12)}
  .act[aria-pressed="true"].c{background:rgba(235,168,58,.12)}
  .more{font-size:11px;color:var(--dim);text-align:left;padding:1px 0}
  .more:hover{color:var(--ink)}
  .fields{display:none;flex-direction:column;gap:6px;padding-top:2px}
  .fields.open{display:flex}
  .fields label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
  .empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;grid-column:1/-1;line-height:1.6}

  /* Фокус-режим */
  .focus{position:fixed;inset:0;background:#0A0906;display:none;z-index:120;flex-direction:column}
  .focus.open{display:flex}
  .f-top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .f-count{font-family:'Unbounded',sans-serif;font-size:15px}
  .f-name{font-size:13px;color:var(--dim);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .f-stage{flex:1;display:grid;place-items:center;padding:16px;overflow:hidden;position:relative}
  .f-stage img,.f-stage video{max-width:100%;max-height:100%;border-radius:10px;display:block;object-fit:contain}
  .f-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(36,32,25,.9);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
  .f-nav:hover{background:var(--panel-2)}
  .f-nav.prev{left:16px} .f-nav.next{right:16px}
  .f-bottom{padding:14px 20px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .f-btn{border:1px solid var(--line);border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;background:var(--panel);display:flex;align-items:center;gap:9px;transition:.15s}
  .f-btn kbd{font-family:'Rubik';font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim)}
  .f-btn.a:hover,.f-btn.a.on{border-color:var(--ok);color:var(--ok);background:rgba(63,184,113,.12)}
  .f-btn.c:hover,.f-btn.c.on{border-color:var(--saffron);color:var(--saffron);background:rgba(235,168,58,.12)}
  .f-btn.r:hover,.f-btn.r.on{border-color:var(--clay);color:var(--clay);background:rgba(210,96,60,.12)}
  .f-note{max-width:420px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel-2);border:1px solid var(--line);padding:11px 18px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .progress{height:3px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:12px;display:none}
  .progress.on{display:block}
  .progress i{display:block;height:100%;background:var(--emerald);width:0;transition:width .2s}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Аджибус · <span>приёмка материалов</span></div>
    <div class="sub">Генерации читаются прямо из папки на вашем компьютере</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><i>всего</i></div>
    <div class="stat ok"><b id="stOk">0</b><i>принято</i></div>
    <div class="stat canon"><b id="stCanon">0</b><i>канон</i></div>
    <div class="stat no"><b id="stNo">0</b><i>отклонено</i></div>
  </div>
</header>

<div class="folder" id="folderBar">
  <span id="folderText">Папка не подключена</span>
  <span class="spacer"></span>
  <button class="btn primary" id="pickBtn">Подключить папку</button>
  <button class="btn" id="rescanBtn" disabled>⟳ Обновить</button>
</div>

<div class="progress" id="prog"><i></i></div>

<div class="bar">
  <button class="btn gold" id="focusBtn">▶ Быстрый отбор</button>
  <div class="seg" id="filters">
    <button data-f="all" aria-pressed="true">Все</button>
    <button data-f="new" aria-pressed="false">Без решения</button>
    <button data-f="accepted" aria-pressed="false">Принятые</button>
    <button data-f="canon" aria-pressed="false">Канон</button>
    <button data-f="rejected" aria-pressed="false">Отклонённые</button>
  </div>
  <div class="seg" id="kinds">
    <button data-k="all" aria-pressed="true">Всё</button>
    <button data-k="image" aria-pressed="false">Фото</button>
    <button data-k="video" aria-pressed="false">Видео</button>
  </div>
  <input class="search" id="search" placeholder="Поиск…">
  <span class="spacer"></span>
  <button class="btn ghost" id="exportBtn">⧉ Отчёт</button>
  <button class="btn ghost" id="backupBtn">↓ Бэкап</button>
  <button class="btn ghost" id="restoreBtn">↑ Восстановить</button>
  <input type="file" id="restoreInput" accept="application/json" hidden>
</div>

<div class="grid" id="grid"></div>

<div class="focus" id="focus">
  <div class="f-top">
    <span class="f-count" id="fCount">0 / 0</span>
    <span class="f-name" id="fName"></span>
    <button class="btn ghost" id="fClose">Закрыть · Esc</button>
  </div>
  <div class="f-stage" id="fStage">
    <button class="f-nav prev" id="fPrev" aria-label="Назад">‹</button>
    <div id="fMedia"></div>
    <button class="f-nav next" id="fNext" aria-label="Вперёд">›</button>
  </div>
  <div class="f-bottom">
    <button class="f-btn a" id="fA">✓ Принять <kbd>1</kbd></button>
    <button class="f-btn c" id="fC">★ В канон <kbd>2</kbd></button>
    <button class="f-btn r" id="fR">✕ Отклонить <kbd>3</kbd></button>
    <input class="f-note" id="fNote" placeholder="Заметка — что править">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- IndexedDB ---------- */
const DBN = 'ajeebus_v3';
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      if(!d.objectStoreNames.contains('assets')) d.createObjectStore('assets', {keyPath:'key'});
      if(!d.objectStoreNames.contains('meta'))   d.createObjectStore('meta');
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror   = ()=>rej(r.error);
  });
}
const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
const dbGet = (store, key) => new Promise((res,rej)=>{ const q = tx(store,'readonly').get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const dbAll = (store) => new Promise((res,rej)=>{ const q = tx(store,'readonly').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
const dbPut = (store, val, key) => new Promise((res,rej)=>{ const q = key!==undefined ? tx(store,'readwrite').put(val,key) : tx(store,'readwrite').put(val); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
const dbDel = (store, key) => new Promise((res,rej)=>{ const q = tx(store,'readwrite').delete(key); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });

/* ---------- состояние ---------- */
let dirHandle = null;
let items = [];                 // {key,name,type,thumb,status,note,tags,model,prompt,mtime,handle}
let filter = 'all', kind = 'all', query = '';
let focusList = [], focusIdx = 0;
const $ = s => document.querySelector(s);
const grid = $('#grid');
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- превью ---------- */
function shrink(src,w,h,max=420,q=.72){
  const k = Math.min(max/w, max/h, 1);
  const c = document.createElement('canvas');
  c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
const imgThumb = file => new Promise((res,rej)=>{
  const u = URL.createObjectURL(file), im = new Image();
  im.onload = ()=>{ try{ res(shrink(im, im.naturalWidth, im.naturalHeight)); }catch(e){ rej(e); } finally{ URL.revokeObjectURL(u); } };
  im.onerror = ()=>{ URL.revokeObjectURL(u); rej(); };
  im.src = u;
});
const vidThumb = file => new Promise((res,rej)=>{
  const u = URL.createObjectURL(file), v = document.createElement('video');
  v.muted = true; v.preload = 'metadata';
  v.onloadeddata = ()=>{ v.currentTime = Math.min(1,(v.duration||2)/3); };
  v.onseeked = ()=>{ try{ res(shrink(v, v.videoWidth, v.videoHeight)); }catch(e){ rej(e); } finally{ URL.revokeObjectURL(u); } };
  v.onerror = ()=>{ URL.revokeObjectURL(u); rej(); };
  v.src = u;
});

/* ---------- папка ---------- */
async function pickFolder(){
  if(!window.showDirectoryPicker){
    toast('Браузер не умеет читать папки. Нужен Chrome или Edge.');
    return;
  }
  try{
    dirHandle = await window.showDirectoryPicker({mode:'read'});
    await dbPut('meta', dirHandle, 'dir');
    await scan();
  }catch(e){ /* пользователь отменил */ }
}
async function restoreFolder(){
  try{
    const h = await dbGet('meta','dir');
    if(!h) return false;
    const p = await h.queryPermission({mode:'read'});
    if(p === 'granted'){ dirHandle = h; return true; }
    dirHandle = h;
    setFolderBar(true);
    return false;
  }catch(e){ return false; }
}
async function ensurePermission(){
  if(!dirHandle) return false;
  const p = await dirHandle.queryPermission({mode:'read'});
  if(p === 'granted') return true;
  const r = await dirHandle.requestPermission({mode:'read'});
  return r === 'granted';
}
function setFolderBar(needsClick){
  const bar = $('#folderBar'), t = $('#folderText'), pick = $('#pickBtn');
  $('#rescanBtn').disabled = !dirHandle;
  if(!dirHandle){
    bar.classList.remove('warn');
    t.innerHTML = 'Папка не подключена';
    pick.textContent = 'Подключить папку';
  } else if(needsClick){
    bar.classList.add('warn');
    t.innerHTML = `Папка <b>${esc(dirHandle.name)}</b> <span class="path">— нужно подтвердить доступ</span>`;
    pick.textContent = 'Разрешить доступ';
  } else {
    bar.classList.remove('warn');
    t.innerHTML = `Папка <b>${esc(dirHandle.name)}</b> <span class="path">— ${items.length} файлов</span>`;
    pick.textContent = 'Сменить папку';
  }
}

async function scan(){
  if(!dirHandle) return;
  if(!await ensurePermission()){ setFolderBar(true); return; }
  const prog = $('#prog'); prog.classList.add('on');
  const bar = prog.firstElementChild;

  const files = [];
  for await (const [name, h] of dirHandle.entries()){
    if(h.kind !== 'file') continue;
    if(!/\.(png|jpe?g|webp|gif|mp4|webm|mov|m4v)$/i.test(name)) continue;
    files.push(h);
  }
  const cached = await dbAll('assets');
  const byKey = new Map(cached.map(a=>[a.key,a]));
  const next = [];
  let done = 0, fresh = 0;

  for(const h of files){
    let f;
    try{ f = await h.getFile(); }catch(e){ continue; }
    const key = `${f.name}|${f.size}|${f.lastModified}`;
    const isVid = /\.(mp4|webm|mov|m4v)$/i.test(f.name);
    let rec = byKey.get(key);
    if(!rec){
      let thumb = '';
      try{ thumb = isVid ? await vidThumb(f) : await imgThumb(f); }catch(e){}
      rec = {key, name:f.name, type:isVid?'video':'image', thumb, status:'new',
             note:'', tags:'', model:'', prompt:'', mtime:f.lastModified};
      await dbPut('assets', rec);
      fresh++;
    }
    next.push({...rec, handle:h});
    done++;
    bar.style.width = Math.round(done/files.length*100) + '%';
  }
  items = next.sort((a,b)=>b.mtime - a.mtime);
  prog.classList.remove('on'); bar.style.width = '0';
  setFolderBar(false);
  render();
  toast(fresh ? `Новых файлов: ${fresh}` : `В папке ${items.length} файлов`);
}

/* ---------- рендер ---------- */
function visible(){
  return items.filter(it=>{
    if(filter !== 'all' && it.status !== filter) return false;
    if(kind !== 'all' && it.type !== kind) return false;
    if(!query) return true;
    return (it.name+' '+it.note+' '+it.tags+' '+it.model+' '+it.prompt).toLowerCase().includes(query.toLowerCase());
  });
}
function render(){
  $('#stTotal').textContent = items.length;
  $('#stOk').textContent    = items.filter(i=>i.status==='accepted').length;
  $('#stNo').textContent    = items.filter(i=>i.status==='rejected').length;
  $('#stCanon').textContent = items.filter(i=>i.status==='canon').length;

  const list = visible();
  if(!list.length){
    grid.innerHTML = '<div class="empty">' +
      (items.length ? 'Ничего не найдено по этому фильтру'
       : (dirHandle ? 'В папке нет фото и видео' : 'Подключите папку, куда Chrome скачивает генерации из Flow')) +
      '</div>';
    return;
  }
  grid.innerHTML = list.map(it=>`
    <div class="card s-${it.status}" data-key="${esc(it.key)}">
      <div class="thumb" data-act="open">
        ${it.thumb ? `<img src="${it.thumb}" alt="" loading="lazy">` : '<span style="color:#6A5B45;font-size:12px">нет превью</span>'}
        <span class="badge ${it.type==='video'?'vid':'img'}">${it.type==='video'?'видео':'фото'}</span>
        <span class="mark">${it.status==='accepted'?'✓':it.status==='rejected'?'✕':'★'}</span>
      </div>
      <div class="body">
        <div class="name">${esc(it.name)}</div>
        <div class="meta"><span>${new Date(it.mtime).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>${it.tags?`<span>#${esc(it.tags)}</span>`:''}</div>
        <button class="more" data-act="toggle">Детали ▾</button>
        <div class="fields">
          <div><label>Сцена / урок</label><input data-field="tags" value="${esc(it.tags)}" placeholder="урок 1, шот 3"></div>
          <div><label>Модель</label><input data-field="model" value="${esc(it.model)}" placeholder="Veo 3.1 Fast · 8s"></div>
          <div><label>Заметка</label><textarea data-field="note">${esc(it.note)}</textarea></div>
        </div>
        <div class="actions">
          <button class="act a" data-act="accepted" aria-pressed="${it.status==='accepted'}">✓</button>
          <button class="act c" data-act="canon"    aria-pressed="${it.status==='canon'}">★</button>
          <button class="act r" data-act="rejected" aria-pressed="${it.status==='rejected'}">✕</button>
        </div>
      </div>
    </div>`).join('');
}

async function setStatus(it, st){
  it.status = (it.status === st) ? 'new' : st;
  await dbPut('assets', strip(it));
}
const strip = it => ({key:it.key,name:it.name,type:it.type,thumb:it.thumb,status:it.status,
                      note:it.note,tags:it.tags,model:it.model,prompt:it.prompt,mtime:it.mtime});

grid.addEventListener('click', async e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const act = e.target.closest('[data-act]')?.dataset.act; if(!act) return;
  const it = items.find(x=>x.key === card.dataset.key); if(!it) return;
  if(act === 'open'){ openFocus(it); return; }
  if(act === 'toggle'){ card.querySelector('.fields').classList.toggle('open'); return; }
  await setStatus(it, act); render();
});
grid.addEventListener('change', async e=>{
  const f = e.target.dataset.field; if(!f) return;
  const it = items.find(x=>x.key === e.target.closest('.card').dataset.key); if(!it) return;
  it[f] = e.target.value; await dbPut('assets', strip(it));
  if(f === 'tags') render();
});

/* ---------- фокус-режим ---------- */
async function openFocus(startItem){
  focusList = visible();
  if(!focusList.length) return;
  focusIdx = startItem ? Math.max(0, focusList.findIndex(x=>x.key === startItem.key)) : 0;
  $('#focus').classList.add('open');
  await showFocus();
}
async function showFocus(){
  const it = focusList[focusIdx];
  if(!it) return;
  $('#fCount').textContent = `${focusIdx+1} / ${focusList.length}`;
  $('#fName').textContent = it.name;
  $('#fNote').value = it.note || '';
  ['fA','fC','fR'].forEach(id=>$('#'+id).classList.remove('on'));
  if(it.status === 'accepted') $('#fA').classList.add('on');
  if(it.status === 'canon')    $('#fC').classList.add('on');
  if(it.status === 'rejected') $('#fR').classList.add('on');

  const media = $('#fMedia');
  media.innerHTML = it.thumb ? `<img src="${it.thumb}" alt="">` : '';
  try{
    const f = await it.handle.getFile();
    const url = URL.createObjectURL(f);
    media.innerHTML = it.type === 'video'
      ? `<video src="${url}" controls autoplay loop></video>`
      : `<img src="${url}" alt="">`;
  }catch(e){}
}
function moveFocus(d){
  focusIdx = (focusIdx + d + focusList.length) % focusList.length;
  showFocus();
}
async function focusStatus(st){
  const it = focusList[focusIdx];
  await setStatus(it, st);
  render();
  if(focusIdx < focusList.length - 1) moveFocus(1); else showFocus();
}
$('#focusBtn').onclick = ()=> openFocus(null);
$('#fClose').onclick = ()=>{ $('#focus').classList.remove('open'); $('#fMedia').innerHTML=''; };
$('#fPrev').onclick = ()=> moveFocus(-1);
$('#fNext').onclick = ()=> moveFocus(1);
$('#fA').onclick = ()=> focusStatus('accepted');
$('#fC').onclick = ()=> focusStatus('canon');
$('#fR').onclick = ()=> focusStatus('rejected');
$('#fNote').onchange = async e=>{
  const it = focusList[focusIdx]; if(!it) return;
  it.note = e.target.value; await dbPut('assets', strip(it)); render();
};
document.addEventListener('keydown', e=>{
  if(!$('#focus').classList.contains('open')) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA'){
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if(e.key === 'Escape'){ $('#fClose').click(); }
  else if(e.key === 'ArrowLeft')  moveFocus(-1);
  else if(e.key === 'ArrowRight') moveFocus(1);
  else if(e.key === '1') focusStatus('accepted');
  else if(e.key === '2') focusStatus('canon');
  else if(e.key === '3') focusStatus('rejected');
});

/* ---------- панель ---------- */
$('#pickBtn').onclick = async ()=>{
  if(dirHandle && await dirHandle.queryPermission({mode:'read'}) !== 'granted'){
    if(await ensurePermission()){ await scan(); return; }
  }
  pickFolder();
};
$('#rescanBtn').onclick = ()=> scan();
$('#filters').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); filter = b.dataset.f; render();
};
$('#kinds').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); kind = b.dataset.k; render();
};
$('#search').oninput = e=>{ query = e.target.value.trim(); render(); };

$('#exportBtn').onclick = ()=>{
  const g = s => items.filter(i=>i.status===s);
  const line = i => `• ${i.name}${i.tags?` [${i.tags}]`:''}${i.model?` — ${i.model}`:''}${i.note?`\n   заметка: ${i.note}`:''}`;
  let out = `ПРИЁМКА · Аджибус\n${new Date().toLocaleString('ru-RU')}\nВсего ${items.length} · принято ${g('accepted').length} · канон ${g('canon').length} · отклонено ${g('rejected').length}\n`;
  [['★ В КАНОН','canon'],['✓ ПРИНЯТО','accepted'],['✕ ОТКЛОНЕНО','rejected'],['… БЕЗ РЕШЕНИЯ','new']].forEach(([t,k])=>{
    const a = g(k); if(a.length) out += `\n${t} (${a.length})\n` + a.map(line).join('\n') + '\n';
  });
  navigator.clipboard.writeText(out).then(()=>toast('Отчёт скопирован')).catch(()=>{console.log(out);toast('Отчёт в консоли')});
};
$('#backupBtn').onclick = ()=>{
  const data = items.map(strip);
  const b = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `ajeebus-priemka-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast('Бэкап сохранён');
};
$('#restoreBtn').onclick = ()=> $('#restoreInput').click();
$('#restoreInput').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    for(const rec of data) await dbPut('assets', rec);
    await scan();
    toast('Восстановлено: ' + data.length);
  }catch(err){ toast('Не удалось прочитать файл'); }
  e.target.value = '';
};

let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2400); }

/* ---------- старт ---------- */
(async ()=>{
  db = await openDB();
  const cached = await dbAll('assets');
  if(cached.length){ items = cached.sort((a,b)=>b.mtime-a.mtime); render(); }
  const ok = await restoreFolder();
  if(ok) await scan(); else { setFolderBar(!!dirHandle); render(); }
})();
</script>
</body>
</html>
