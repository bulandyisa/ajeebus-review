<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аджибус · уровень 2 глазами ученика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F3; --page:#FFFFFF; --ink:#1F1B15; --dim:#6E6455; --faint:#A2977F;
    --line:#E6DFD2; --line-2:#D6CCBA; --accent:#B07A1E; --accent-soft:#FDF3DF;
    --emerald:#1F7A64; --well:#F5F0E6;
  }
  :root[data-theme="dark"]{
    --bg:#13110D; --page:#1A1713; --ink:#F2EADB; --dim:#9C907A; --faint:#6A5B45;
    --line:#332D23; --line-2:#4A4132; --accent:#EBA83A; --accent-soft:#241D10;
    --emerald:#2BC0A1; --well:#0F0D0A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.62;
    -webkit-font-smoothing:antialiased}
  .ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate}
  /* внутри русского абзаца арабская фраза — атомарный кусок: не рвётся и не меняет порядок */
  .rule .ar,.can .ar,.phrase .ar,.bg-words .ar,.goal .ar{display:inline-block;white-space:nowrap;
    vertical-align:baseline}

  /* ---- шапка ---- */
  header{position:sticky;top:0;z-index:10;background:var(--bg);
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .hrow{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
  .brand span{color:var(--dim);font-weight:400}
  .nav{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
  .nav a{display:inline-block;min-width:26px;text-align:center;padding:3px 5px;border-radius:6px;
    font-size:12.5px;color:var(--dim);text-decoration:none;font-family:system-ui,sans-serif}
  .nav a:hover{background:var(--accent-soft);color:var(--accent)}
  .nav b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    font-family:system-ui,sans-serif;font-weight:600;margin:0 4px 0 9px}
  .tbtn{margin-left:auto;border:1px solid var(--line);background:var(--page);color:var(--dim);
    border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-family:system-ui,sans-serif}
  .tbtn:hover{border-color:var(--line-2);color:var(--ink)}

  /* ---- полотно ---- */
  main{max-width:820px;margin:0 auto;padding:0 22px 90px}
  .season{margin:58px 0 30px;padding-top:26px;scroll-margin-top:132px;border-top:2px solid var(--line-2)}
  .season:first-child{border-top:0;margin-top:34px;padding-top:0}
  .season .sn{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--accent);font-weight:600}
  .season h2{font-size:27px;line-height:1.25;margin-top:5px;font-weight:600}
  .season p{color:var(--dim);margin-top:7px;font-size:15.5px}

  .lesson{background:var(--page);border:1px solid var(--line);border-radius:16px;
    padding:30px 34px;margin-bottom:20px;scroll-margin-top:132px}
  .lnum{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--faint);font-weight:600}
  .lesson h3{font-size:25px;line-height:1.25;margin:5px 0 9px;font-weight:600}
  .goal{color:var(--dim);font-size:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}

  .block{margin-top:22px}
  .bh{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:11px}

  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}
  .w{background:var(--well);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .w .a{font-size:22px;line-height:1.5;color:var(--ink);font-weight:600;text-align:left}
  .w .t{font-size:13px;color:var(--faint);font-family:system-ui,sans-serif;margin-top:2px}
  .w .r{font-size:15px;color:var(--dim);margin-top:1px}
  .bg-words{margin-top:11px;font-size:14.5px;color:var(--dim);line-height:2}
  .bg-words i{color:var(--faint);font-style:normal;font-family:system-ui,sans-serif;font-size:12px;
    letter-spacing:.04em;display:block;margin-bottom:2px}
  .bg-words .ar{font-size:18px;color:var(--ink)}

  .rule h4{font-size:19px;margin-bottom:9px;font-weight:600}
  .rule p{margin-bottom:12px}
  .rule .ar{font-size:20px}
  details{margin-top:2px}
  summary{cursor:pointer;color:var(--accent);font-size:14.5px;font-family:system-ui,sans-serif;
    list-style:none;padding:3px 0}
  summary::-webkit-details-marker{display:none}
  summary:before{content:'+ ';font-weight:600}
  details[open] summary:before{content:'– '}
  details p{margin-top:11px}

  .can{list-style:none}
  .can li{padding-left:19px;position:relative;margin-bottom:5px}
  .can li:before{content:'—';position:absolute;left:0;color:var(--faint)}
  .phrase{margin-top:15px;padding:13px 16px;background:var(--accent-soft);
    border-radius:11px;font-size:15.5px}
  .phrase b{font-weight:600}

  @media (max-width:640px){
    body{font-size:16px}
    .lesson{padding:22px 18px;border-radius:13px}
    .words{grid-template-columns:1fr}
    .season h2{font-size:23px}
    .lesson h3{font-size:21px}
  }
  @media print{
    header{display:none} body{background:#fff}
    .lesson{break-inside:avoid;border:0;border-bottom:1px solid #ddd;border-radius:0;padding:16px 0}
    details{display:block} details p{display:block}
  }
</style>
</head>
<body>
<header><div class="hrow">
  <div class="brand">Аджибус · уровень 2 <span>— глазами ученика</span></div>
  <nav class="nav" id="nav"></nav>
  <button class="tbtn" id="theme">☾ Тёмная</button>
</div></header>
<main id="main"></main>

<script>window.AJ = window.AJ || {};</script>
<script>(function(){var v='?v='+Math.floor(Date.now()/60000);
  document.write('<script src="program.js'+v+'"><\/script>');
  document.write('<script src="seasons.js'+v+'"><\/script>');})();</script>
<script>
(function(){
  var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  /* арабские куски внутри русского текста заворачиваем, чтобы не ломалась вязь */
  var AR='\\u0600-\\u06FF\\u0750-\\u077F', HA='\\u064B-\\u0652', PU='\\u060C\\u061F!';
  var reAr=new RegExp('['+AR+'](?:['+AR+HA+PU+'\\s]*['+AR+HA+'\\u061F!])?','g');
  var wrapAr=function(s){return esc(s).replace(reAr,function(m){return '<span class="ar">'+m+'</span>';});};

  var P=(window.AJ.program||[]).slice().sort(function(a,b){return a.n-b.n;});
  var SEAS=window.AJ.seasons||[];
  var seasonOf=function(n){for(var i=0;i<SEAS.length;i++){
    var it=SEAS[i].items||[];for(var j=0;j<it.length;j++) if(it[j][0]===n) return SEAS[i];}return null;};
  var titleOf=function(n){for(var i=0;i<SEAS.length;i++){
    var it=SEAS[i].items||[];for(var j=0;j<it.length;j++) if(it[j][0]===n) return it[j][1];}return 'Урок '+n;};

  var html='', nav='', lastS=null;
  P.forEach(function(L){
    var S=seasonOf(L.n);
    if(S&&S!==lastS){
      lastS=S;
      html+='<section class="season"><div class="sn">Сезон '+S.n+'</div><h2>'+esc(S.title)+'</h2>'
          + (S.idea?'<p>'+esc(S.idea)+'</p>':'')+'</section>';
      nav+='<b>'+esc(S.title)+'</b>';
    }
    nav+='<a href="#u'+L.n+'">'+L.n+'</a>';

    var core=(L.vocab||[]).filter(function(v){return v.kind!=='seed';});
    var seed=(L.vocab||[]).filter(function(v){return v.kind==='seed';});
    var T=L.theory||{}, TX=T.text||[];

    html+='<article class="lesson" id="u'+L.n+'">'
      + '<div class="lnum">Урок '+L.n+'</div>'
      + '<h3>'+esc(titleOf(L.n))+'</h3>'
      + '<div class="goal">'+esc(L.goal||'')+'</div>'

      + '<div class="block"><div class="bh">Слова урока</div><div class="words">'
      + core.map(function(v){return '<div class="w"><div class="a ar">'+esc(v.ar)+'</div>'
          + '<div class="t">'+esc(v.tr||'')+'</div><div class="r">'+esc(v.ru||'')+'</div></div>';}).join('')
      + '</div>'
      + (seed.length?'<div class="bg-words"><i>звучит в уроке, но не спрашивается</i>'
          + seed.map(function(v){return '<span class="ar">'+esc(v.ar)+'</span> — '+esc(v.ru);}).join(' · ')
          + '</div>':'')
      + '</div>'

      + (T.title?'<div class="block rule"><div class="bh">Правило</div>'
          + '<h4>'+wrapAr(T.title)+'</h4>'
          + TX.slice(0,2).map(function(t){return '<p>'+wrapAr(t)+'</p>';}).join('')
          + (TX.length>2?'<details><summary>ещё деталь</summary>'
              + TX.slice(2).map(function(t){return '<p>'+wrapAr(t)+'</p>';}).join('')+'</details>':'')
          + '</div>':'')

      + '<div class="block"><div class="bh">Теперь ты умеешь</div><ul class="can">'
      + (L.wrap||[]).map(function(w){return '<li>'+wrapAr(w)+'</li>';}).join('')
      + '</ul>'
      + (L.phrase?'<div class="phrase"><b>Фраза дня.</b> '+wrapAr(L.phrase)+'</div>':'')
      + '</div>'
      + '</article>';
  });

  document.getElementById('main').innerHTML = html ||
    '<section class="season"><h2>Программа не загрузилась</h2><p>Рядом с этой страницей должны лежать program.js и seasons.js.</p></section>';
  document.getElementById('nav').innerHTML = nav;

  var root=document.documentElement, btn=document.getElementById('theme');
  var set=function(t){root.setAttribute('data-theme',t);
    btn.textContent = t==='dark' ? '☀ Светлая' : '☾ Тёмная';
    try{localStorage.setItem('aj_prog_theme',t);}catch(e){}};
  var saved=null; try{saved=localStorage.getItem('aj_prog_theme');}catch(e){}
  set(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
  btn.onclick=function(){set(root.getAttribute('data-theme')==='dark'?'light':'dark');};
})();
</script>
</body>
</html>
